<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { background: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        .table-wrapper { border-top: 1px solid #94a3b8; border-left: 1px solid #94a3b8; }
        .excel-table { border-collapse: separate; border-spacing: 0; width: 100%; user-select: none; }
        .excel-table th, .excel-table td { border-bottom: 1px solid #94a3b8; border-right: 1px solid #94a3b8; padding: 2px; background-clip: padding-box; vertical-align: middle; }
        .excel-table th.fixed-col, .excel-table td.fixed-col { border-right: 2px solid #475569 !important; transition: background-color 0.2s ease; }
        
        .z-top-left { z-index: 60 !important; } .z-top { z-index: 50 !important; } .z-left { z-index: 40 !important; }      

        .selected-cell { box-shadow: inset 0 0 0 2px #3b82f6 !important; background-color: #eff6ff !important; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* ПІДСВІТКА АКТИВНОГО РЯДКА ТА ПРЕДМЕТА */
        tr:focus-within td, tr:focus-within th,
        tr.hover-row td, tr.hover-row th {
            background-color: #eef2ff !important; /* Ніжний синій колір */
        }
        
        /* Щоб зафіксована колонка зліва також підсвічувалась і не втрачала свою позицію */
        tr:focus-within td.fixed-col, tr.hover-row td.fixed-col {
            background-color: #eef2ff !important;
            z-index: 55 !important; /* Трохи піднімаємо над звичайними комірками, але під шапкою */
        }

        .print-header-view { display: none; }

        @media print {
            @page { size: landscape; margin: 5mm; }
            body { background: white; padding: 0 !important; margin: 0 !important; overflow: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-hide { display: none !important; }
            .print-header-view.show-print { display: block !important; }
            body, html { height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; }
            .hidden { display: none !important; }
            .view-mode-container:not(.hidden), #view-gen:not(.hidden), #view-spec:not(.hidden), .table-wrapper { 
                height: auto !important; min-height: auto !important; max-height: none !important; overflow: visible !important; display: block !important;
            }
            .table-wrapper { border: none !important; }
            .excel-table { width: 100% !important; table-layout: fixed; }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; }
            .excel-table th, .excel-table td { border: 1px solid #000 !important; color: #000 !important; padding: 1px !important; font-size: 8px !important; white-space: normal !important; word-wrap: break-word; }
            .excel-table th.fixed-col, .excel-table td.fixed-col { border-right: 1px solid #000 !important; }
            .sticky { position: static !important; }
            .teacher-select { display: none !important; }
            input[type="number"], input[type="text"] { border: none; background: transparent; -webkit-appearance: none; pointer-events: none; color: #000; font-size: 9px !important; padding: 0 !important; width: 100%; text-align: center; }
            .min-w-\[250px\], .w-\[250px\] { min-width: 140px !important; width: 140px !important; max-width: 140px !important; }
            .min-w-\[224px\], .w-56 { min-width: 130px !important; width: 130px !important; max-width: 130px !important; }
            .min-w-\[42px\], .w-\[42px\] { min-width: 22px !important; width: 22px !important; max-width: 22px !important; }
            .selected-cell { box-shadow: none !important; background-color: transparent !important; }
            
            /* Вимикаємо підсвітку під час друку */
            tr:focus-within td, tr:focus-within th,
            tr.hover-row td, tr.hover-row th,
            tr:focus-within td.fixed-col, tr.hover-row td.fixed-col {
                background-color: transparent !important;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-slate-700">

    <div id="print-header-vib" class="print-header-view text-center mb-4 pt-4">
        <h1 class="text-base font-bold text-black" style="font-family: 'Times New Roman', serif;">
            Вибірка годин з навчальних планів з <span id="print-type-label"></span> предметів<br>
            <span class="print-inst-name-span"></span> на <span id="print-year-label"></span> н.р.
        </h1>
    </div>

    <!-- ПІДМЕНЮ -->
    <div id="submenu-vib" class="flex justify-between items-center text-sm font-medium text-slate-500 shrink-0 border-b border-slate-200 pb-2 print-hide pt-1">
        <div class="flex gap-4">
            <button class="main-sub-tab active text-indigo-600 border-b-2 border-indigo-600 pb-1" data-target="view-gen" data-printname="загальноосвітніх">Загальноосвітня</button>
            <button class="main-sub-tab hover:text-slate-800 pb-1 transition-colors" data-target="view-spec" data-printname="спец">Спецпідготовка</button>
        </div>
        <div class="flex gap-2">
            <button onclick="exportToExcelJS('vib')" class="px-3 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg shadow-sm transition-colors border border-green-200"><i class="fa-solid fa-file-excel mr-1"></i> Excel</button>
            <button onclick="exportToWord('vib')" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg shadow-sm transition-colors border border-blue-200"><i class="fa-solid fa-file-word mr-1"></i> Word</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg shadow-sm transition-colors border border-slate-300"><i class="fa-solid fa-print mr-1"></i> Друк</button>
        </div>
    </div>

    <!-- КОНТЕЙНЕРИ -->
    <div id="mode-vib" class="flex-1 flex flex-col overflow-hidden h-full view-mode-container pt-2">
        <div id="view-gen" class="flex-1 flex flex-col overflow-hidden h-full">
            <h2 class="text-lg font-bold mb-2 shrink-0 text-slate-800 print-hide">Загальноосвітня підготовка <span class="text-xs font-normal text-slate-500">(тільки групи на базі 9 класів)</span></h2>
            <div class="overflow-auto flex-1 bg-white relative table-wrapper rounded-tl-lg" id="table-scroll-gen">
                <table id="table-gen-export" class="w-full text-left text-sm whitespace-nowrap excel-table relative">
                    <thead id="gen-thead"><tr><th class="p-3 bg-slate-200 sticky top-0 left-0">Завантаження...</th></tr></thead>
                    <tbody id="gen-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="view-spec" class="flex-1 flex flex-col overflow-hidden h-full hidden">
            <h2 class="text-lg font-bold mb-2 shrink-0 text-slate-800 print-hide">Спецпідготовка <span class="text-xs font-normal text-slate-500">(усі групи)</span></h2>
            <div class="overflow-auto flex-1 bg-white relative table-wrapper rounded-tl-lg" id="table-scroll-spec">
                <table id="table-spec-export" class="w-full text-left text-sm whitespace-nowrap excel-table relative">
                    <thead id="spec-thead"><tr><th class="p-3 bg-slate-200 sticky top-0 left-0">Завантаження...</th></tr></thead>
                    <tbody id="spec-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ВИПАДНИЙ СПИСОК ВИКЛАДАЧІВ -->
    <div id="global-teacher-dropdown" class="fixed hidden bg-white border border-slate-300 shadow-2xl z-[150] w-64 rounded-xl flex flex-col text-sm overflow-hidden">
        <div class="p-2 border-b border-slate-100 bg-slate-50 relative">
            <i class="fa-solid fa-search absolute left-4 top-4 text-slate-400 text-xs"></i>
            <input type="text" id="teacher-search-input" class="w-full pl-7 pr-2 py-1.5 border border-slate-300 rounded-lg outline-none text-xs focus:border-indigo-500" placeholder="Пошук..." autocomplete="off">
        </div>
        <div id="teacher-list-container" class="max-h-60 overflow-y-auto divide-y divide-slate-100 bg-white"></div>
    </div>

    <script type="module">
        const p = window.parent; 

        document.querySelectorAll('.main-sub-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.main-sub-tab').forEach(b => { b.classList.remove('active', 'text-indigo-600', 'border-b-2', 'border-indigo-600'); b.classList.add('text-slate-500'); });
                e.target.classList.add('active', 'text-indigo-600', 'border-b-2', 'border-indigo-600'); e.target.classList.remove('text-slate-500');
                document.getElementById('view-gen').classList.add('hidden'); document.getElementById('view-spec').classList.add('hidden');
                document.getElementById(e.target.dataset.target).classList.remove('hidden');
            });
        });

        window.addEventListener('beforeprint', () => {
            const activeTab = document.querySelector('.main-sub-tab.active');
            document.getElementById('print-type-label').innerText = activeTab ? activeTab.getAttribute('data-printname') : '';
            document.getElementById('print-year-label').innerText = p.CURRENT_YEAR;
            document.querySelectorAll('.print-inst-name-span').forEach(el => el.innerText = p.INSTITUTION_NAME);
            document.getElementById('print-header-vib').classList.add('show-print');
        });
        window.addEventListener('afterprint', () => document.getElementById('print-header-vib').classList.remove('show-print'));

        window.onDataUpdated = function() {
            // Перевіряємо, чи користувач зараз знаходиться в полі вводу
            const activeEl = document.activeElement;
            const isTyping = activeEl && activeEl.tagName === 'INPUT';
            
            if (isTyping) {
                // Якщо користувач вводить дані — оновлюємо ТІЛЬКИ суми, щоб не збити курсор
                window.updateCalculations();
            } else {
                // Якщо ні — перемальовуємо таблицю повністю
                renderGeneralGrid();
                renderSpecialGrid();
                window.updateCalculations();
            }
        };

        function createEditableCell(cellId, isGenTable = false, extraClasses = '', twoTeachers = false, readonly = false, noTeacherSelect = false) {
            const data = p.workloadMap[cellId] || { hours: '', teacherId: '', teacherId2: '' };
            const hasHours = data.hours && parseFloat(data.hours) > 0;
            const isAssigned = data.teacherId && data.teacherId !== '';
            let isGlobalReadonly = !p.HAS_LICENSE || readonly;
            
            let bgColorClass = '';
            if (hasHours && !readonly) {
                if (noTeacherSelect) bgColorClass = '!bg-slate-100';
                else bgColorClass = isAssigned ? '!bg-[#dcfce7]' : '!bg-pink-100';
            }

            let selectedName = twoTeachers ? '- Майстер 1 -' : '- Викладач -';
            if (data.teacherId) { const t = p.teachersData.find(x => x.id === data.teacherId); if (t) selectedName = t.name; }
            let selectedName2 = '- Майстер 2 -';
            if (data.teacherId2) { const t2 = p.teachersData.find(x => x.id === data.teacherId2); if (t2) selectedName2 = t2.name; }

            let html = `<td class="p-0 text-center min-w-[42px] w-[42px] transition-colors duration-200 bg-white ${bgColorClass} ${extraClasses} editable-cell" id="td-${cellId}" data-cellid="${cellId}">
                    <div class="flex flex-col items-center justify-center relative w-full h-full">
                        <input type="number" min="0" value="${data.hours || ''}" class="w-full h-full text-center p-1 outline-none font-bold text-slate-800 bg-transparent focus:bg-transparent" ${isGlobalReadonly ? 'disabled' : ''} oninput="window.saveWorkload('${cellId}', 'hours', this.value)"
                        onfocus="this.closest('tr').classList.add('hover-row')" onblur="this.closest('tr').classList.remove('hover-row')">`;
            if (!isGlobalReadonly && !noTeacherSelect) {
                html += `<div id="tsel-${cellId}" class="teacher-select w-full text-[9px] p-0.5 outline-none bg-transparent cursor-pointer text-slate-600 border-t border-slate-300 hover:bg-indigo-100 truncate select-none" style="display: ${hasHours ? 'block' : 'none'};" onclick="window.openTeacherDropdown('${cellId}', ${isGenTable}, event, 1)">${selectedName}</div>`;
                if (twoTeachers) { html += `<div id="tsel-${cellId}-2" class="teacher-select w-full text-[9px] p-0.5 outline-none bg-transparent cursor-pointer text-slate-600 border-t border-slate-300 hover:bg-indigo-100 truncate select-none mt-px" style="display: ${hasHours ? 'block' : 'none'};" onclick="window.openTeacherDropdown('${cellId}', ${isGenTable}, event, 2)">${selectedName2}</div>`; }
            }
            html += `</div></td>`;
            return html;
        }

        window.saveWorkload = async (cellId, field, value) => {
            if (!p.HAS_LICENSE) return;
            if (!p.workloadMap[cellId]) p.workloadMap[cellId] = {};
            p.workloadMap[cellId][field] = value;
            let payloadToSave = { [field]: value };

            if (field === 'hours') {
                const numValue = parseFloat(value);
                if (isNaN(numValue) || numValue <= 0 || value === '') {
                    p.workloadMap[cellId].teacherId = ''; p.workloadMap[cellId].teacherId2 = ''; 
                    payloadToSave.teacherId = ''; payloadToSave.teacherId2 = '';
                    let isTwoTeachers = cellId.includes('STATIC_pract') || cellId.includes('STATIC_navch');
                    const s1 = document.getElementById(`tsel-${cellId}`); if(s1) s1.innerText = isTwoTeachers ? '- Майстер 1 -' : '- Викладач -';
                    const s2 = document.getElementById(`tsel-${cellId}-2`); if(s2) s2.innerText = '- Майстер 2 -';
                }
            }
            
            const updatedData = p.workloadMap[cellId]; 
            const hasHours = updatedData.hours && parseFloat(updatedData.hours) > 0;
            const isAssigned = updatedData.teacherId && updatedData.teacherId !== '';

            const td = document.getElementById(`td-${cellId}`);
            if (td) { 
                const hasTeacherSelect = td.querySelector('.teacher-select') !== null;
                const input = td.querySelector('input');
                const isReadonly = !input || input.disabled;

                td.classList.remove('!bg-[#dcfce7]', '!bg-pink-100', '!bg-slate-100'); 
                if (hasHours && !isReadonly) { 
                    if (hasTeacherSelect) { td.classList.add(isAssigned ? '!bg-[#dcfce7]' : '!bg-pink-100'); } 
                    else { td.classList.add('!bg-slate-100'); }
                } 
            }
            if (field === 'hours') {
                const s1 = document.getElementById(`tsel-${cellId}`); if(s1) s1.style.display = hasHours ? 'block' : 'none';
                const s2 = document.getElementById(`tsel-${cellId}-2`); if(s2) s2.style.display = hasHours ? 'block' : 'none';
            }
            window.updateCalculations();
            
            // Збереження через API батьківського вікна!
            p.api.saveWorkload(cellId, payloadToSave).catch(console.error);
        };

        // ЛОГІКА DROPDOWN
        window.getTeacherTotalHours = function(teacherId, excludePractNavch = false) {
            let total = 0; 
            for (let key in p.workloadMap) { 
                if (excludePractNavch && (key.includes('STATIC_pract') || key.includes('STATIC_navch'))) continue;
                if (p.workloadMap[key].teacherId === teacherId || p.workloadMap[key].teacherId2 === teacherId) {
                    total += parseFloat(p.workloadMap[key].hours) || 0; 
                }
            }
            return Math.round(total * 100) / 100;
        }

        window.openTeacherDropdown = function(cellId, isGenTable, event, slot = 1) {
            event.stopPropagation(); const rect = event.currentTarget.getBoundingClientRect(); const dropdown = document.getElementById('global-teacher-dropdown');
            window.currentDropdownCellId = cellId; window.currentDropdownIsGen = isGenTable; window.currentDropdownSlot = slot;
            window.currentDropdownOnlyMasters = cellId.includes('_STATIC_navch_') && !cellId.includes('STATIC_navch_spec') && !cellId.includes('STATIC_navch_zo') || cellId.includes('_STATIC_pract_');

            document.getElementById('teacher-search-input').value = ''; window.renderTeacherDropdownList(); dropdown.classList.remove('hidden');

            const dropdownHeight = dropdown.offsetHeight; const spaceBelow = window.innerHeight - rect.bottom;
            if (spaceBelow < dropdownHeight && rect.top > dropdownHeight) dropdown.style.top = `${rect.top - dropdownHeight}px`; else dropdown.style.top = `${rect.bottom}px`;
            const dropW = dropdown.offsetWidth || 256; 
            if (rect.left + dropW > window.innerWidth) dropdown.style.left = `${window.innerWidth - dropW - 10}px`; else dropdown.style.left = `${rect.left}px`;
            document.getElementById('teacher-search-input').focus();
        };

        window.renderTeacherDropdownList = function() {
            const searchStr = document.getElementById('teacher-search-input').value.toLowerCase(); const listCont = document.getElementById('teacher-list-container');
            let isTwoTeachers = window.currentDropdownCellId.includes('STATIC_pract') || window.currentDropdownCellId.includes('STATIC_navch');
            let clearText = window.currentDropdownSlot === 1 ? (isTwoTeachers ? '- Майстер 1 -' : '- Викладач -') : '- Майстер 2 -';
            let html = `<div class="p-2.5 hover:bg-red-50 text-red-500 cursor-pointer text-xs font-semibold" onclick="window.selectTeacher('', '${clearText}')"><i class="fa-solid fa-xmark mr-2"></i>Очистити вибір</div>`;
            const isSubjectCell = !(window.currentDropdownCellId.includes('STATIC_pract') || window.currentDropdownCellId.includes('STATIC_navch'));

            p.teachersData.forEach(t => {
                if (window.currentDropdownOnlyMasters && t.position !== 'Майстер в/н') return;
                if (searchStr && !t.name.toLowerCase().includes(searchStr)) return;
                const excludePractNavch = (isSubjectCell && t.position === 'Майстер в/н');
                const totalH = window.getTeacherTotalHours(t.id, excludePractNavch);
                html += `<div class="p-2 hover:bg-indigo-50 cursor-pointer flex justify-between items-center transition-colors" onclick="window.selectTeacher('${t.id}', '${t.name.replace(/'/g, "\\'")}')"><span class="font-medium text-slate-800 text-xs">${t.name}</span><span class="text-indigo-600 font-bold bg-indigo-100/50 px-1.5 py-0.5 rounded text-[10px] ml-4 shrink-0">${totalH > 0 ? totalH : 0} год</span></div>`;
            });
            listCont.innerHTML = html;
        };
        document.getElementById('teacher-search-input').addEventListener('input', window.renderTeacherDropdownList);
        
        window.selectTeacher = function(id, name) { 
            const field = window.currentDropdownSlot === 1 ? 'teacherId' : 'teacherId2'; 
            window.saveWorkload(window.currentDropdownCellId, field, id); 
            const selDiv = document.getElementById(window.currentDropdownSlot === 1 ? `tsel-${window.currentDropdownCellId}` : `tsel-${window.currentDropdownCellId}-2`); 
            if (selDiv) selDiv.innerText = name; 
            document.getElementById('global-teacher-dropdown').classList.add('hidden'); 
        };
        document.addEventListener('click', (e) => { const dropdown = document.getElementById('global-teacher-dropdown'); if (!dropdown.classList.contains('hidden') && !dropdown.contains(e.target)) dropdown.classList.add('hidden'); });

        // РЕНДЕР ЗАГАЛЬНООСВІТНЬОЇ
        function renderGeneralGrid() {
            const thead = document.getElementById('gen-thead'); const tbody = document.getElementById('gen-tbody');
            const genGroups = p.groupsData.filter(g => g.education.includes('Базова'));
            
            if (genGroups.length === 0) { 
                thead.innerHTML = `<tr><th class="p-3 bg-slate-100 text-slate-500 font-bold border-b-0">Інформація</th></tr>`; 
                tbody.innerHTML = `<tr><td class="p-8 text-center text-slate-500 bg-white border-t-0"><i class="fa-solid fa-users text-4xl mb-3 text-slate-300"></i><br>Немає груп на базі 9 класів.</td></tr>`; 
                return; 
            }

            const courses = [1, 2, 3, 4]; let courseGroups = {}; let hasCourse = {};
            courses.forEach(c => { courseGroups[c] = genGroups.filter(g => parseInt(g.course) === c); hasCourse[c] = courseGroups[c].length > 0; });

            let courseRow = `<tr><th class="h-[32px] bg-slate-200 sticky left-0 top-0 z-top-left fixed-col min-w-[250px] w-[250px] text-center align-middle shadow-sm" rowspan="2">Назва предмета</th>`;
            courses.forEach(c => { if(hasCourse[c]) { courseRow += `<th colspan="${courseGroups[c].length}" class="h-[32px] bg-slate-200 text-center text-xs uppercase sticky top-0 z-top shadow-sm">${c} курс</th><th class="h-[32px] bg-yellow-300 text-center text-xs uppercase w-12 font-bold sticky top-0 z-top shadow-sm" rowspan="2">${['І','ІІ','ІІІ','IV'][c-1]} К</th>`; } });
            courseRow += `<th class="h-[32px] bg-yellow-400 text-center text-xs uppercase w-12 font-bold sticky top-0 z-top shadow-sm" rowspan="2" style="writing-mode: vertical-rl; transform: rotate(180deg);">Разом</th></tr><tr>`;
            courses.forEach(c => { if(hasCourse[c]) { courseGroups[c].forEach(g => { courseRow += `<th class="h-[40px] bg-slate-100 text-center font-bold text-indigo-700 text-xs min-w-[42px] w-[42px] px-1 sticky top-[32px] z-top shadow-sm">${g.num ? g.num : g.name}</th>`; }); } });
            thead.innerHTML = courseRow + `</tr>`;

            let excelRowCounter = 3; let rowExcelMap = {};
            p.genSubjectsData.filter(s => !s.isExcluded).forEach(s => { rowExcelMap[s.id] = excelRowCounter++; if (s.isSplit) rowExcelMap[s.id+'_split'] = excelRowCounter++; });
            rowExcelMap['CALC_total'] = excelRowCounter++; rowExcelMap['CALC_main'] = excelRowCounter++; rowExcelMap['CALC_split'] = excelRowCounter++; rowExcelMap['STATIC_consult'] = excelRowCounter++; rowExcelMap['STATIC_exams'] = excelRowCounter++; rowExcelMap['CALC_grand'] = excelRowCounter++;
            p.genSubjectsData.filter(s => s.isExcluded).forEach(s => { rowExcelMap[s.id] = excelRowCounter++; if (s.isSplit) rowExcelMap[s.id+'_split'] = excelRowCounter++; });

            let bodyHtml = '';
            const renderRow = (rowKey, title, isSplit, isYellow, isEditable = true, isExcluded = false, extraClasses = '') => {
                let bgSolid = isYellow ? 'bg-yellow-300' : (isExcluded ? (isSplit ? 'bg-[#fff8f0]' : 'bg-[#fff3e0]') : (isSplit ? 'bg-[#f8fafc]' : 'bg-white'));
                let rowClass = isYellow ? 'bg-yellow-300 font-bold text-slate-800' : (isSplit ? 'bg-[#f8fafc] italic text-sm text-indigo-700' : 'bg-white hover:bg-slate-50 text-indigo-900 font-bold text-sm transition-colors');
                if (isExcluded) rowClass = isSplit ? 'bg-[#fff8f0] text-orange-600' : 'bg-[#fff3e0] text-orange-900';

                let rowHtml = `<tr class="${rowClass}"><td class="p-2 sticky left-0 z-left fixed-col ${bgSolid} ${extraClasses}">${title}</td>`;

                let currentExcelCol = 2; let courseTotalCols = [];
                courses.forEach(c => {
                    if(hasCourse[c]) {
                        let count = courseGroups[c].length;
                        courseGroups[c].forEach(g => {

        // ЛОГІКА EXPORT EXCEL
        function getColLetter(num) {
            let letter = ''; while (num > 0) { let mod = (num - 1) % 26; letter = String.fromCharCode(65 + mod) + letter; num = Math.floor((num - mod) / 26); }
            return letter;
        }

        window.exportToExcelJS = async function(mode) {
            const wb = new ExcelJS.Workbook();
            
            function processTableToSheet(tableElement, sheetName) {
                const ws = wb.addWorksheet(sheetName);
                tableElement.querySelectorAll('input').forEach(inp => { inp.setAttribute('value', inp.value); });
                const tableClone = tableElement.cloneNode(true);
                tableClone.querySelectorAll('.print-hide').forEach(e => e.remove());
                const rows = tableClone.querySelectorAll('tr');
                
                let offsetR = 2;
                let totalCols = 0;
                if(rows.length > 0) { rows[0].querySelectorAll('th, td').forEach(c => totalCols += parseInt(c.getAttribute('colspan')) || 1); }
                
                ws.mergeCells(1, 1, 2, totalCols);
                let typeText = sheetName === 'Загальноосвітня' ? 'загальноосвітніх' : 'спец';
                let cell1 = ws.getCell(1, 1);
                cell1.value = `Вибірка годин з навчальних планів з ${typeText} предметів\n${p.INSTITUTION_NAME} на ${p.CURRENT_YEAR} н.р.`;
                cell1.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                cell1.font = { name: 'Times New Roman', size: 12, bold: true };

                let matrix = [];
                let visibleRows = Array.from(rows).filter(r => r.style.display !== 'none');
                
                visibleRows.forEach((tr, rIdx) => {
                    let cIdx = 0;
                    const cells = tr.querySelectorAll('th, td');
                    
                    cells.forEach(cell => {
                        while(matrix[rIdx] && matrix[rIdx][cIdx]) { cIdx++; }
                        let rSpan = parseInt(cell.getAttribute('rowspan')) || 1; let cSpan = parseInt(cell.getAttribute('colspan')) || 1;
                        for(let r = 0; r < rSpan; r++) { for(let c = 0; c < cSpan; c++) { if(!matrix[rIdx + r]) matrix[rIdx + r] = []; matrix[rIdx + r][cIdx + c] = true; } }
                        
                        const targetRow = offsetR + rIdx + 1; const targetCol = cIdx + 1;
                        const excelCell = ws.getCell(targetRow, targetCol);
                        if (rSpan > 1 || cSpan > 1) ws.mergeCells(targetRow, targetCol, targetRow + rSpan - 1, targetCol + cSpan - 1);
                        
                        let val = '';
                        const input = cell.querySelector('input');
                        if (input) val = input.getAttribute('value') || input.value;
                        else { const clone = cell.cloneNode(true); clone.querySelectorAll('.teacher-select').forEach(e => e.remove()); val = clone.innerText.trim(); }
                        
                        let sumRows = cell.getAttribute('data-sum-rows'); let sumCols = cell.getAttribute('data-sum-cols'); let sumRange = cell.getAttribute('data-sum-range'); 
                        
                        if (sumCols) excelCell.value = { formula: '=' + sumCols.split(',').map(c => getColLetter(parseInt(c)) + targetRow).join('+'), result: parseFloat(val) || 0 };
                        else if (sumRows !== null) { if (sumRows.trim() === '') excelCell.value = parseFloat(val) || 0; else excelCell.value = { formula: '=' + sumRows.split(',').map(r => getColLetter(targetCol) + (offsetR + parseInt(r))).join('+'), result: parseFloat(val) || 0 }; }
                        else if (sumRange) { let parts = sumRange.split(':'); excelCell.value = { formula: `=SUM(${getColLetter(parseInt(parts[0]))}${targetRow}:${getColLetter(parseInt(parts[1]))}${targetRow})`, result: parseFloat(val) || 0 }; }
                        else if (val === '') excelCell.value = null; else if (!isNaN(val)) excelCell.value = parseFloat(val); else excelCell.value = val;
                        
                        let argb = 'FFFFFFFF'; const classStr = (cell.className + ' ' + tr.className);
                        if(classStr.includes('bg-slate-200') && !classStr.includes('!bg-')) argb = 'FFE2E8F0';
                        else if(classStr.includes('bg-slate-300')) argb = 'FFCBD5E1';
                        else if(classStr.includes('bg-yellow-300') || classStr.includes('!bg-yellow-300')) argb = 'FFFDE047';
                        else if(classStr.includes('bg-yellow-400') || classStr.includes('!bg-yellow-400')) argb = 'FFFACC15';
                        else if(classStr.includes('bg-yellow-200') || classStr.includes('!bg-yellow-200')) argb = 'FFFEF08A';
                        else if(classStr.includes('bg-slate-100') && !classStr.includes('!bg-')) argb = 'FFF1F5F9';
                        else if(classStr.includes('!bg-[#dcfce7]') || classStr.includes('bg-[#dcfce7]')) argb = 'FFDCFCE7';
                        else if(classStr.includes('!bg-pink-100') || classStr.includes('bg-pink-100')) argb = 'FFFCE7F3';
                        else if(classStr.includes('bg-[#f8fafc]')) argb = 'FFF8FAFC';
                        else if(classStr.includes('bg-[#fff3e0]')) argb = 'FFFFF3E0';
                        else if(classStr.includes('bg-[#fff8f0]')) argb = 'FFFFF8F0';
                        
                        if(argb !== 'FFFFFFFF') excelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } };
                        excelCell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        
                        let isBold = cell.tagName === 'TH' || classStr.includes('font-bold'); let isItalic = classStr.includes('italic'); let fontColor = 'FF000000';
                        if(classStr.includes('text-indigo-700') || classStr.includes('text-indigo-900')) fontColor = 'FF312E81';
                        if(classStr.includes('text-slate-400') || classStr.includes('text-slate-300')) fontColor = 'FF94A3B8';
                        if(classStr.includes('text-orange-600') || classStr.includes('text-orange-900')) fontColor = 'FFC2410C';
                        if(classStr.includes('text-teal-700') || classStr.includes('text-teal-900')) fontColor = 'FF0F766E';
                        
                        excelCell.font = { bold: isBold, italic: isItalic, color: { argb: fontColor }, size: 9, name: 'Arial' };
                        let align = { vertical: 'middle', horizontal: 'center', wrapText: true };
                        if(classStr.includes('text-left')) align.horizontal = 'left';
                        if(classStr.includes('text-right')) align.horizontal = 'right';
                        if(cell.style.writingMode === 'vertical-rl') align.textRotation = 90;
                        excelCell.alignment = align;
                    });
                });
                ws.columns.forEach((col, i) => { if (sheetName === 'Спецпідготовка') { if(i===0) col.width=4; else if(i===1) col.width=30; else col.width=5; } else { if(i===0) col.width=35; else col.width=5; } });
            }
            
            processTableToSheet(document.getElementById('table-gen-export'), 'Загальноосвітня');
            processTableToSheet(document.getElementById('table-spec-export'), 'Спецпідготовка');
            const buffer = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Вибірка_${p.CURRENT_YEAR}.xlsx`);
        };

        // ЛОГІКА EXPORT WORD
        window.exportToWord = function(mode) {
            let style = `<style>
                @page WordSection1 { size: 29.7cm 21.0cm; mso-page-orientation: landscape; margin: 1cm; } div.WordSection1 { page: WordSection1; }
                body { font-family: 'Times New Roman', serif; } p, table, td, th, tr { margin: 0; padding: 0; }
                table { border-collapse: collapse; width: 100%; font-size: 10px; margin-bottom: 20px; }
                th, td { border: 1px solid #000; padding: 2px; text-align: center; vertical-align: middle; }
                .page-break { page-break-before: always; } .hidden-row { display: none !important; }
            </style>`;
            
            function cleanTableForWord(tableElement) {
                const clone = document.getElementById(tableElement).cloneNode(true);
                clone.querySelectorAll('input').forEach(inp => { clone.querySelector(`[id="${inp.id}"]`).setAttribute('value', inp.value); });
                clone.querySelectorAll('.teacher-select').forEach(e => e.remove());
                clone.querySelectorAll('.print-hide').forEach(e => e.remove());
                
                clone.querySelectorAll('tr').forEach(tr => { if (tr.style.display === 'none') tr.classList.add('hidden-row'); tr.removeAttribute('style'); });
                clone.querySelectorAll('th, td').forEach(cell => {
                    const input = cell.querySelector('input'); let val = input ? (input.getAttribute('value') || '') : cell.innerText.trim();
                    let bgColor = ''; const cls = cell.className || '';
                    if(cls.includes('bg-slate-200') && !cls.includes('!bg-')) bgColor = '#e2e8f0';
                    else if(cls.includes('bg-slate-300')) bgColor = '#cbd5e1';
                    else if(cls.includes('bg-yellow-300') || cls.includes('!bg-yellow-300') || cls.includes('bg-yellow-100')) bgColor = '#fef08a';
                    else if(cls.includes('bg-yellow-400') || cls.includes('!bg-yellow-400')) bgColor = '#facc15';
                    else if(cls.includes('bg-slate-100') && !cls.includes('!bg-')) bgColor = '#f1f5f9';
                    else if(cls.includes('!bg-[#dcfce7]') || cls.includes('bg-[#dcfce7]')) bgColor = '#dcfce7';
                    else if(cls.includes('!bg-pink-100') || cls.includes('bg-pink-100')) bgColor = '#fce7f3';
                    
                    cell.innerHTML = val; cell.removeAttribute('class'); cell.removeAttribute('style');
                    let styleStr = 'margin: 0; padding: 2px;'; if (bgColor) styleStr += ` background-color: ${bgColor};`;
                    if (cell.style.writingMode === 'vertical-rl') styleStr += ` width: 30px; word-break: break-all; text-align: center; mso-layout-flow: vertical-ideographic; writing-mode: tb-rl;`;
                    if (cls.includes('font-bold') || cell.tagName === 'TH') styleStr += ` font-weight: bold;`;
                    if (cls.includes('text-left')) styleStr += ` text-align: left;`;
                    cell.setAttribute('style', styleStr);
                });
                return clone.outerHTML;
            }
            
            let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8">${style}</head><body><div class="WordSection1">`;
            html += `<h2 style="text-align:center; font-size: 16px; margin-bottom: 10px;">Вибірка годин з навчальних планів з загальноосвітніх предметів<br>${p.INSTITUTION_NAME} на ${p.CURRENT_YEAR} н.р.</h2>` + cleanTableForWord('table-gen-export');
            html += `<div class="page-break"></div>`;
            html += `<h2 style="text-align:center; font-size: 16px; margin-bottom: 10px;">Вибірка годин з навчальних планів з спец предметів<br>${p.INSTITUTION_NAME} на ${p.CURRENT_YEAR} н.р.</h2>` + cleanTableForWord('table-spec-export');
            html += `</div></body></html>`;
            
            saveAs(new Blob([html], { type: 'application/msword' }), `Вибірка_${p.CURRENT_YEAR}.doc`);
        };

        // Логіка масового виділення і копіювання
        let selectedCells = new Set();
        let isDragging = false; let startCell = null;

        function getTableGrid(table) {
            let grid = [];
            for (let r = 0; r < table.rows.length; r++) {
                let tr = table.rows[r]; if (!grid[r]) grid[r] = []; let cIdx = 0;
                for (let c = 0; c < tr.cells.length; c++) {
                    let td = tr.cells[c]; while (grid[r][cIdx]) cIdx++; 
                    let rSpan = parseInt(td.getAttribute('rowspan')) || 1; let cSpan = parseInt(td.getAttribute('colspan')) || 1;
                    for (let y = 0; y < rSpan; y++) { for (let x = 0; x < cSpan; x++) { if (!grid[r + y]) grid[r + y] = []; grid[r + y][cIdx + x] = td; } }
                    cIdx += cSpan;
                }
            } return grid;
        }

        function getCellCoords(grid, td) {
            for (let y = 0; y < grid.length; y++) { for (let x = 0; x < grid[y].length; x++) { if (grid[y][x] === td) return {x, y}; } } return null;
        }

        document.addEventListener('mousedown', (e) => {
            if (!p.HAS_LICENSE) return;
            if (e.target.closest('#submenu-vib')) return;
            let td = e.target.closest('td.editable-cell');
            if (td && td.querySelector('input')) {
                isDragging = true;
                if (!e.ctrlKey && !e.shiftKey) clearSelection();
                startCell = td; selectCell(td);
            } else clearSelection();
        });

        document.addEventListener('mouseover', (e) => {
            if (isDragging && startCell) { let td = e.target.closest('td.editable-cell'); if (td && td.querySelector('input')) selectBox(startCell, td); }
        });
        document.addEventListener('mouseup', () => { isDragging = false; });

        function selectCell(td) {
            if(!td.id) td.id = 'temp_' + Date.now() + Math.random();
            selectedCells.add(td.id); td.classList.add('selected-cell');
            if(selectedCells.size === 1) { let inp = td.querySelector('input'); if(inp) inp.focus(); }
        }

        function clearSelection() {
            selectedCells.forEach(id => { let el = document.getElementById(id); if(el) el.classList.remove('selected-cell'); });
            selectedCells.clear();
        }

        function selectBox(sTd, eTd) {
            clearSelection();
            let table = sTd.closest('table'); if (!table || table !== eTd.closest('table')) return;
            let grid = getTableGrid(table); let p1 = getCellCoords(grid, sTd); let p2 = getCellCoords(grid, eTd);
            if (!p1 || !p2) return;
            let minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x), minY = Math.min(p1.y, p2.y), maxY = Math.max(p1.y, p2.y);
            for(let y = minY; y <= maxY; y++) { for(let x = minX; x <= maxX; x++) { let cell = grid[y][x]; if(cell && cell.querySelector('input') && !selectedCells.has(cell.id)) selectCell(cell); } }
        }

        document.addEventListener('keydown', (e) => {
            if (!p.HAS_LICENSE) return; 
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedCells.size > 0) {
                    if (selectedCells.size === 1 && document.activeElement.tagName === 'INPUT') return;
                    selectedCells.forEach(id => {
                        let td = document.getElementById(id);
                        if (td) {
                            let input = td.querySelector('input'); let cellId = td.getAttribute('data-cellid');
                            if (input && !input.disabled) {
                                input.value = '';
                                if(cellId) window.saveWorkload(cellId, 'hours', '');
                                else input.dispatchEvent(new Event('input', { bubbles: true }));
                            }
                        }
                    });
                }
            } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const active = document.activeElement;
                if (!active || active.tagName !== 'INPUT' || !active.closest('td')) return;
                const td = active.closest('td'); const tr = td.closest('tr'); const tbody = tr.closest('tbody');
                if (!tbody) return;
                const currentCellIndex = Array.from(tr.children).indexOf(td); const currentRowIndex = Array.from(tbody.children).indexOf(tr);
                let nextActive = null;
                
                if (e.key === 'ArrowUp' && currentRowIndex > 0) { nextActive = tbody.children[currentRowIndex - 1].children[currentCellIndex]?.querySelector('input:not([disabled])'); e.preventDefault(); }
                else if (e.key === 'ArrowDown' && currentRowIndex < tbody.children.length - 1) { nextActive = tbody.children[currentRowIndex + 1].children[currentCellIndex]?.querySelector('input:not([disabled])'); e.preventDefault(); }
                else if (e.key === 'ArrowLeft') {
                    let prevTd = td.previousElementSibling; while(prevTd && !prevTd.querySelector('input:not([disabled])')) prevTd = prevTd.previousElementSibling;
                    if (prevTd) nextActive = prevTd.querySelector('input'); e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    let nextTd = td.nextElementSibling; while(nextTd && !nextTd.querySelector('input:not([disabled])')) nextTd = nextTd.nextElementSibling;
                    if (nextTd) nextActive = nextTd.querySelector('input'); e.preventDefault();
                }
                
                if (nextActive) { nextActive.focus(); nextActive.select(); }
            }
        });

        document.addEventListener('paste', (e) => {
            if (!p.HAS_LICENSE) return; 
            let activeTd = null;
            if (document.activeElement.tagName === 'INPUT' && document.activeElement.closest('td')) activeTd = document.activeElement.closest('td');
            else if (selectedCells.size === 1) activeTd = document.getElementById(Array.from(selectedCells)[0]);
            else if (selectedCells.size > 0 && startCell) {
                let grid = getTableGrid(startCell.closest('table')); let minX = Infinity, minY = Infinity;
                selectedCells.forEach(id => {
                    let td = document.getElementById(id);
                    if(td) { let coords = getCellCoords(grid, td); if(coords && (coords.y < minY || (coords.y === minY && coords.x < minX))) { minY = coords.y; minX = coords.x; activeTd = td; } }
                });
            }
            if (!activeTd) return;
            
            let grid = getTableGrid(activeTd.closest('table')); let start = getCellCoords(grid, activeTd); if (!start) return;
            e.preventDefault();
            let text = (e.clipboardData || window.clipboardData).getData('text');
            let rows = text.split(/\r?\n/); let isMultiSelect = selectedCells.size > 1;
            
            rows.forEach((rowText, rOffset) => {
                if (!rowText.trim() && rOffset === rows.length - 1) return;
                let cols = rowText.split('\t'); let targetY = start.y + rOffset;
                if (targetY >= grid.length) return;
                cols.forEach((val, cOffset) => {
                    let targetX = start.x + cOffset; if (targetX >= grid[targetY].length) return;
                    let targetCell = grid[targetY][targetX];
                    if (isMultiSelect && (!targetCell || !selectedCells.has(targetCell.id))) return;
                    
                    if (targetCell && targetCell.querySelector('input')) {
                        let input = targetCell.querySelector('input'); if (input.disabled) return;
                        let cellId = targetCell.getAttribute('data-cellid');
                        let numVal = parseFloat(val.replace(',', '.').replace(/[^0-9.]/g, ''));
                        input.value = isNaN(numVal) ? '' : numVal;
                        if (cellId) window.saveWorkload(cellId, 'hours', input.value);
                        else input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                });
            });
        });

        document.addEventListener('wheel', (e) => { if (document.activeElement.type === 'number') document.activeElement.blur(); });

        // Ініціалізація, якщо дані вже завантажені
        if(p.groupsData && p.groupsData.length > 0) window.onDataUpdated();

    </script>
