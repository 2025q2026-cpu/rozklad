                    <td class="p-1 op-num bg-white text-center font-bold text-slate-500 border-r border-slate-300 z-left">${i+1}</td>
                    <td class="p-1 op-tch bg-white font-bold text-slate-800 !border-r-2 !border-r-slate-800 truncate z-left" title="${t.name}">${t.name}</td>`;
                
                daysConfig.forEach((d, dIdx) => {
                    for(let l=1; l<=d.count; l++) {
                        let bClass = (l === d.count) ? "!border-r-2 !border-r-slate-800" : "border-r border-r-slate-300";
                        let key = `${t.id}_${dIdx}_${l}`;
                        let val = data[key] || '';
                        html += `<td class="p-0 ${bClass} selectable-cell">
                            <input type="text" class="oper-input w-full h-full text-center p-1 outline-none font-bold bg-transparent text-slate-800 transition-colors" 
                                   data-teacher="${t.id}" data-key="${key}" value="${val}" 
                                   oninput="window.handleOperInput(this)" autocomplete="off" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                        </td>`;
                    }
                });
                html += `</tr>`;
            });

            // 2.5. ПРИМІТКИ ДЛЯ ДРУКУ
            let prymitkyText = window.rozkladData[rIdx]?.prymitky || '';
            let totalCols = 2; daysConfig.forEach(d => totalCols += d.count);
            
            if (prymitkyText) {
                let safeHtml = prymitkyText.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                html += `<tr class="print-table-row" style="display: none;">
                    <td colspan="${totalCols}" class="p-2 text-xs whitespace-pre-wrap border-t border-slate-300 bg-white"><strong>Примітки:</strong><br>${safeHtml}</td>
                </tr>`;
            }

            // 3. ЗАГОЛОВОК ВИРОБНИЧОГО НАВЧАННЯ
            html += `<tr class="bg-yellow-100 transition-colors border-y-2 border-yellow-300 print-page-break-before">
                <td class="p-1 op-num bg-yellow-200 text-center font-bold text-slate-500 border-r border-slate-300 z-left"></td>
                <td class="p-2 op-tch bg-yellow-200 font-black uppercase text-slate-800 !border-r-2 !border-r-slate-800 text-center z-left">Виробниче навчання</td>`;
            daysConfig.forEach((d, dIdx) => {
                for(let l=1; l<=d.count; l++) {
                    let bClass = (l === d.count) ? "!border-r-2 !border-r-slate-800" : "border-r border-r-slate-300";
                    html += `<td class="p-0 ${bClass} bg-yellow-50/50">
                        <input type="text" class="w-full h-full cursor-not-allowed" disabled>
                    </td>`;
                }
            });
            html += `</tr>`;

            // 4. ГРУПИ В/Н
            p.groupsData.forEach((g) => {
                let rId = p.ekranData[g.id]?.rozklads?.[window.currentRozkladIndex]?.id;
                let maxHours = rId ? getMaxRozkladHour(g.id, 'spec_STATIC_navch', rId) : 0;
                
                let hasData = false;
                daysConfig.forEach((d, dIdx) => {
                    for(let l=1; l<=d.count; l++) {
                        if (data[`vnsgrp_${g.id}_${dIdx}_${l}`]) hasData = true;
                    }
                });

                if (maxHours === 0 && !hasData) return;

                let gNum = g.num || g.name;
                html += `<tr class="hover:bg-yellow-50 transition-colors">
                    <td class="p-1 op-num bg-white text-center font-bold text-slate-400 border-r border-slate-300 z-left text-xs">в/н</td>
                    <td class="p-1 op-tch bg-white font-bold text-slate-700 !border-r-2 !border-r-slate-800 text-right pr-4 z-left text-xs">Вир. навчання № ${gNum}</td>`;
                
                daysConfig.forEach((d, dIdx) => {
                    for(let l=1; l<=d.count; l++) {
                        let bClass = (l === d.count) ? "!border-r-2 !border-r-slate-800" : "border-r border-r-slate-300";
                        let key = `vnsgrp_${g.id}_${dIdx}_${l}`;
                        let val = data[key] || '';
                        html += `<td class="p-0 ${bClass} selectable-cell">
                            <input type="text" class="oper-input vns-group-input w-full h-full text-center p-1 outline-none font-bold bg-transparent text-slate-800 transition-colors focus:bg-yellow-100" 
                                   data-vnsgroupid="${g.id}" data-vnsgroupnum="${gNum}" data-key="${key}" value="${val}" 
                                   oninput="window.handleOperInput(this)" autocomplete="off" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                        </td>`;
                    }
                });
                html += `</tr>`;
            });
            
            html += `</tbody>`;

            if (prymitkyText) {
                let safeHtml = prymitkyText.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                html += `<tfoot class="sticky-bottom z-50 relative print-hide-strict"><tr><td colspan="${totalCols}" class="p-0 text-left font-medium text-slate-800 bg-white border-t border-slate-300 text-sm shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                    <details class="p-2 px-4 bg-yellow-50/50 print-hide">
                        <summary class="font-bold cursor-pointer text-slate-700 outline-none hover:text-yellow-700 select-none">Примітки (розгорнути)</summary>
                        <div class="mt-2 whitespace-pre-wrap">${safeHtml}</div>
                    </details>
                    <div class="hidden print-block p-2 px-4 text-xs whitespace-pre-wrap"><strong>Примітки:</strong><br>${safeHtml}</div>
                </td></tr></tfoot>`;
            }

            html += `</table></div>`;
            document.getElementById('rozklad-table-container').innerHTML = html;
            window.validateOperatyvny();
        }

        function generateRegTable(groupsArray, isPrint = false) {
            const daysConfig = getDaysConfig();
            let rIdx = window.currentRozkladIndex;
            let meta = window.rozkladData[rIdx]?.meta || {};
            let timesData = window.rozkladData[rIdx]?.times || {};
            let regData = window.rozkladData[rIdx]?.reg || {};
            let commentsData = window.rozkladData[rIdx]?.comments || {};
            let lunchAfter = meta.lunchAfter !== undefined ? parseInt(meta.lunchAfter) : 4;

            let tableClass = isPrint ? 'w-full text-left text-[10px] excel-table bg-white table-fixed border-collapse' : 'w-full text-left text-sm whitespace-nowrap excel-table relative bg-white';
            let tableId = isPrint ? '' : 'id="table-export"';
            
            const bR = isPrint ? 'border-right: 2px solid black !important;' : 'border-right: 3px solid #1e293b !important;';
            const bB = isPrint ? 'border-bottom: 2px solid black !important;' : 'border-bottom: 3px solid #1e293b !important;';
            const normB = isPrint ? 'border-bottom: 1px solid black !important;' : 'border-bottom: 1px solid #cbd5e1 !important;';
            const bRbB = `${bR} ${bB}`;
            
            const zTL = isPrint ? '' : 'z-index: 110 !important; background-color: #e2e8f0 !important; position: sticky !important; top: 0 !important;';
            const zT1 = isPrint ? '' : 'z-index: 105 !important; background-color: #ffffff !important; position: sticky !important; top: 0 !important;';
            const zT2 = isPrint ? '' : 'z-index: 105 !important; background-color: #ffffff !important; position: sticky !important; top: 32px !important;';
            const zT3 = isPrint ? '' : 'z-index: 105 !important; background-color: #e2e8f0 !important; position: sticky !important; top: 58px !important;';
            
            const zL_gray = isPrint ? '' : 'z-index: 80 !important; background-color: #f1f5f9 !important;';
            const zL_white = isPrint ? '' : 'z-index: 80 !important; background-color: #ffffff !important;';

            let tHtml = `<table class="${tableClass}" ${tableId}>`;
            
            if (isPrint) {
                tHtml += `<colgroup>
                    <col style="width: 2%;">
                    <col style="width: 2%;">
                    <col style="width: 6%;">`;
                groupsArray.forEach(() => {
                    tHtml += `
                    <col style="width: 10.5%;">
                    <col style="width: 2.5%;">
                    <col style="width: 5%;">`;
                });
                tHtml += `</colgroup>`;
            }

            tHtml += `<thead class="${isPrint ? '' : 'sticky top-0 z-[100]'}"><tr>`;
            
            tHtml += `<th rowspan="3" class="${isPrint ? 'p-0 border-r border-black' : 'reg-day p-1 border-r border-slate-300 shadow-sm text-sm'}" style="${zTL} ${bB}"><div class="mx-auto" style="writing-mode: vertical-rl; transform: rotate(180deg);">День тижня</div></th>`;
            tHtml += `<th rowspan="3" class="${isPrint ? 'p-0 border-r border-black' : 'reg-num p-1 border-r border-slate-300 shadow-sm text-sm'}" style="${zTL} ${bB}"><div class="mx-auto" style="writing-mode: vertical-rl; transform: rotate(180deg);">Номер уроку</div></th>`;
            tHtml += `<th rowspan="3" class="${isPrint ? 'p-0' : 'reg-time p-1 shadow-sm text-sm'}" style="${zTL} ${bRbB}">Години<br>заняття</th>`;
            
            groupsArray.forEach(g => {
                let grpClass = isPrint ? 'p-0 text-center font-bold' : 'p-1 text-center font-bold shadow-sm w-[210px] min-w-[210px] max-w-[210px] text-sm';
                tHtml += `<th colspan="3" class="${grpClass}" style="${zT1} ${bR}">
                    <div class="flex justify-between px-1 text-sm">
                        <span>Група №: <span class="text-indigo-700 text-base">${g.num}</span></span>
                        <span>Курс: <span class="text-indigo-700">${g.course}</span></span>
                    </div>
                </th>`;
            });
            tHtml += `</tr><tr>`;
            
            groupsArray.forEach(g => {
                let pClass = isPrint ? 'p-0 text-center text-[9px] italic truncate overflow-hidden' : 'p-1 text-center text-xs shadow-sm truncate max-w-[210px] overflow-hidden';
                tHtml += `<th colspan="3" class="${pClass}" style="${zT2} ${bR}">
                    <span class="font-normal italic block w-full whitespace-nowrap overflow-hidden text-ellipsis" title="${g.name}">${g.name}</span>
                </th>`;
            });
            tHtml += `</tr><tr>`;

            groupsArray.forEach(g => {
                let thSubj = isPrint ? 'p-0 border-r border-black text-center text-[8px] font-bold' : 'p-1 text-center text-xs font-bold border-r border-slate-300 shadow-sm w-[100px] min-w-[100px]';
                let thRoom = isPrint ? 'p-0 border-r border-black text-center text-[8px] font-bold' : 'p-1 text-center text-xs font-bold border-r border-slate-300 shadow-sm w-[35px] min-w-[35px] max-w-[35px]';
                let thTeach = isPrint ? 'p-0 text-center text-[8px] font-bold' : 'p-1 text-center text-xs font-bold shadow-sm w-[75px] min-w-[75px]';
                
                tHtml += `<th class="${thSubj}" style="${zT3} ${bB}">Предмет</th>
                          <th class="${thRoom}" style="${zT3} ${bB}">Каб.</th>
                          <th class="${thTeach}" style="${zT3} ${bRbB}">Викладач</th>`;
            });
            tHtml += `</tr></thead><tbody>`;

            daysConfig.forEach((d, dIdx) => {
                let isLastDay = (dIdx === daysConfig.length - 1);
                let extraRows = isLastDay ? 2 : 0;
                let hasLunch = (lunchAfter > 0 && d.count > lunchAfter);
                let totalRows = d.count + (hasLunch ? 1 : 0) + extraRows;
                
                for(let l=1; l<=d.count; l++) {
                    tHtml += `<tr>`;
                    let isLastLesson = (l === d.count && extraRows === 0);
                    let isBeforeLunch = (l === lunchAfter);
                    let rowBottomBorder = isLastLesson ? bB : normB;
                    
                    if (l === 1) {
                        let dayClass = isPrint ? 'p-0 border-r border-black text-center font-bold uppercase text-[9px]' : `p-1 text-center font-bold uppercase tracking-widest border-r border-slate-300 reg-day text-xs`;
                        tHtml += `<td rowspan="${totalRows}" class="${dayClass}" style="${zL_gray} ${bB}"><div class="mx-auto" style="writing-mode: vertical-rl; transform: rotate(180deg);">${d.name}</div></td>`;
                    }

                    let numClass = isPrint ? `p-0 text-center font-bold border-r border-black` : `p-1 text-center font-bold border-r border-slate-300 reg-num text-sm`;
                    tHtml += `<td class="${numClass}" style="${zL_white} ${rowBottomBorder}">${l}</td>`;

                    let timeVal = timesData[l] || '';
                    if (isPrint) {
                        tHtml += `<td class="p-0 text-center text-[9px] font-bold" style="${bR} ${rowBottomBorder}">${timeVal}</td>`;
                    } else {
                        tHtml += `<td class="p-0 reg-time" style="${zL_white} ${bR} ${rowBottomBorder}">
                            <input type="text" class="time-input-${l} w-full h-full text-center outline-none bg-transparent text-xs font-bold focus:bg-indigo-50" value="${timeVal}" oninput="window.saveRozkladTime(${l}, this.value)" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                        </td>`;
                    }

                    groupsArray.forEach(g => {
                        let cell = window.currentRegGrid[g.id][dIdx][l];
                        let cellKey = `${g.id}_${dIdx}_${l}`;
                        let cmt = commentsData[cellKey];
                        
                        if (isPrint) {
                            let subjName = cell.subjName || '';
                            let room = regData[`room_${cellKey}`] || '';
                            let teach = cell.tName || '';
                            
                            tHtml += `<td class="p-0 border-r border-black text-[9px] font-bold text-center align-middle" style="${rowBottomBorder}"><div class="truncate-print mx-auto" title="${subjName}">${subjName}</div></td>
                                      <td class="p-0 border-r border-black text-[9px] font-bold text-center" style="${rowBottomBorder}">${room}</td>
                                      <td class="p-0 text-[8px] text-center align-middle" style="${bR} ${rowBottomBorder}"><div class="truncate-print mx-auto" style="max-width: 45px;" title="${teach}">${teach}</div></td>`;
                        } else {
                            let pointerClass = (!cell.isAuto && cell.availableSubjs.length > 1 && cell.tId && cell.tId !== 'VNS') ? 'cursor-pointer hover:bg-indigo-50 reg-subj-cell' : '';
                            let subjDisplay = cell.subjName || (cell.tId && !cell.isAuto && cell.availableSubjs.length > 1 ? '<span class="text-slate-300 text-[9px]">Оберіть...</span>' : '');

                            let triHtml = (cmt && cmt.text) ? `<div class="comment-triangle" style="border-bottom-color: ${cmt.color}"></div>` : '';
                            let titleAttr = (cmt && cmt.text) ? `title="${cmt.text.replace(/"/g, '&quot;')}"` : '';

                            tHtml += `<td id="td_reg_${cellKey}" data-groupid="${g.id}" data-didx="${dIdx}" data-lidx="${l}" class="p-0 border-r border-slate-300 bg-white selectable-cell relative ${pointerClass}" style="${rowBottomBorder}" ${pointerClass ? `onclick="window.openRegSubjDropdown('${g.id}', ${dIdx}, ${l}, event)"` : ''} ${titleAttr}>
                                <div class="w-full h-full p-1 text-xs font-bold text-slate-800 flex items-center justify-center text-center break-words leading-tight relative" style="min-height:30px;">
                                    ${subjDisplay}
                                    ${triHtml}
                                </div>
                            </td>`;
                            
                            tHtml += `<td class="p-0 border-r border-slate-300 bg-white selectable-cell w-[35px] min-w-[35px] max-w-[35px]" style="${rowBottomBorder}">
                                <input type="text" class="w-full h-full text-center outline-none bg-transparent text-xs font-bold focus:bg-indigo-50" value="${cell.room}" oninput="window.saveRozklad('room_${cellKey}', this.value, true)" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                            </td>`;
                            
                            tHtml += `<td class="p-1 bg-white text-[11px] text-slate-600 text-center break-words leading-tight" style="${bR} ${rowBottomBorder}">${cell.tName}</td>`;
                        }
                    });
                    tHtml += `</tr>`;

                    if (hasLunch && isBeforeLunch) {
                        tHtml += `<tr>`;
                        if (isPrint) {
                            tHtml += `<td class="p-0 text-center font-bold border-r border-black bg-gray-50" style="${normB}"></td>`;
                            tHtml += `<td class="p-0 text-center bg-gray-50" style="${bR} ${normB}"></td>`;
                            groupsArray.forEach(g => {
                                tHtml += `<td colspan="3" class="p-0 text-center font-bold italic text-[9px] text-slate-500 uppercase bg-gray-50 tracking-[0.3em]" style="${bR} ${normB}">Обід</td>`;
                            });
                        } else {
                            tHtml += `<td class="p-1 text-center font-bold border-r border-slate-300 reg-num text-sm" style="${zL_gray} ${normB}"></td>`;
                            tHtml += `<td class="p-1 text-center font-bold reg-time text-sm" style="${zL_gray} ${bR} ${normB}"></td>`;
                            groupsArray.forEach(g => {
                                tHtml += `<td colspan="3" class="p-1 text-center font-bold italic text-slate-400 bg-slate-50 uppercase tracking-widest text-xs" style="${bR} ${normB}">Обід</td>`;
                            });
                        }
                        tHtml += `</tr>`;
                    }
                }
                
                if (isLastDay) {
                    for (let e = 1; e <= 2; e++) {
                        tHtml += `<tr>`;
                        let isLastExtra = (e === 2);
                        let rowBottomBorder = isLastExtra ? bB : normB;
                        
                        let fakeNum = d.count + e;
                        let numClass = isPrint ? `p-0 text-center font-bold border-r border-black` : `p-1 text-center font-bold border-r border-slate-300 reg-num text-sm`;
                        tHtml += `<td class="${numClass}" style="${zL_white} ${rowBottomBorder}">${fakeNum}</td>`;
                        
                        let timeKey = `last_ex${e}`;
                        let timeVal = timesData[timeKey] || '';
                        if (isPrint) {
                            tHtml += `<td class="p-0 text-center text-[9px] font-bold" style="${bR} ${rowBottomBorder}">${timeVal}</td>`;
                        } else {
                            tHtml += `<td class="p-0 reg-time" style="${zL_white} ${bR} ${rowBottomBorder}">
                                <input type="text" class="time-input-${timeKey} w-full h-full text-center outline-none bg-transparent text-xs font-bold focus:bg-indigo-50" value="${timeVal}" oninput="window.saveRozkladTime('${timeKey}', this.value)" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                            </td>`;
                        }
                        
                        groupsArray.forEach(g => {
                            let cellKey = `last_ex${e}_${g.id}`;
                            let val = regData[cellKey] || '';
                            if (isPrint) {
                                tHtml += `<td colspan="3" class="p-0 text-[10px] font-bold text-center align-middle" style="${bR} ${rowBottomBorder}"><div class="truncate-print mx-auto w-full max-w-[150px]">${val}</div></td>`;
                            } else {
                                tHtml += `<td colspan="3" class="p-0 bg-white selectable-cell" style="${bR} ${rowBottomBorder}">
                                    <input type="text" class="w-full h-full text-center outline-none bg-transparent text-xs font-bold focus:bg-indigo-50" value="${val}" oninput="window.saveRozklad('${cellKey}', this.value, true)" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                                </td>`;
                            }
                        });
                        tHtml += `</tr>`;
                    }
                }
            });
            tHtml += `</tbody></table>`;
            return tHtml;
        }

        function renderZvychainy() {
            let rIdx = window.currentRozkladIndex;
            let meta = window.rozkladData[rIdx]?.meta || {};
            
            let lunchSel = document.getElementById('lunch-select');
            if(lunchSel) lunchSel.value = meta.lunchAfter !== undefined ? meta.lunchAfter : 4;
            
            let gridData = buildRegGrid(rIdx);
            window.currentRegGrid = gridData.grid;
            window.currentRegUsages = gridData.usages;

            let screenHtml = `<div class="flex flex-col h-full w-full print-hide">`;
            
            screenHtml += `
            <div class="flex justify-between items-start w-full p-4 bg-white shrink-0 border-b border-slate-200 z-50">
                <div class="w-1/3 text-left">
                    <div class="font-bold text-xs mb-1">"ПОГОДЖЕНО"</div>
                    ${buildSigSelect('sigTopL', meta.sigTopL)}
                </div>
                <div class="w-1/3 text-center">
                    <div class="text-xl font-bold uppercase tracking-widest text-slate-800">Розклад уроків</div>
                    <div class="text-sm font-medium italic text-slate-700">${getActiveRozkladDateString()}</div>
                </div>
                <div class="w-1/3 flex flex-col items-end">
                    <div class="font-bold text-xs mb-1 pr-12">"ЗАТВЕРДЖУЮ"</div>
                    <div class="flex items-end justify-end gap-2 w-full mt-1">
                        ${buildSigSelect('sigTopR', meta.sigTopR, window.formatApprDate(meta.approvalDate))}
                        <input type="date" value="${meta.approvalDate || ''}" onchange="window.saveRozkladMeta('approvalDate', this.value)" class="print-hide border border-slate-300 rounded p-1 text-xs outline-none bg-white cursor-pointer h-[26px]">
                    </div>
                </div>
            </div>`;

            screenHtml += `<div class="flex-1 overflow-auto w-full bg-slate-50 relative table-wrapper select-none">`;
            screenHtml += generateRegTable(p.groupsData, false);
            screenHtml += `</div>`;

            let commentsHtml = getRegCommentsHtml(p.groupsData);

            screenHtml += `
            <div class="w-full shrink-0 bg-white border-t border-slate-300 z-50">`;
            if (commentsHtml) {
                screenHtml += `
                <details class="px-4 py-2 border-b border-slate-200 text-xs bg-amber-50/30">
                    <summary class="font-bold cursor-pointer text-slate-700 outline-none hover:text-amber-700 select-none">Коментарі (розгорнути)</summary>
                    <div class="mt-2 text-left font-medium text-slate-800 overflow-y-auto max-h-32 pr-2">${commentsHtml}</div>
                </details>`;
            }
            screenHtml += `
                <div class="flex justify-between p-4">
                    <div>${buildSigSelect('sigBot1', meta.sigBot1)}</div>
                    <div>${buildSigSelect('sigBot2', meta.sigBot2)}</div>
                    <div>${buildSigSelect('sigBot3', meta.sigBot3)}</div>
                </div>
            </div>`;
            screenHtml += `</div>`;

            let printHtml = '<div class="hidden print-block w-full">';
            const chunks = [];
            let groupsPerPage = window.currentPrintGroupsPerPage || 5;
            
            for (let i = 0; i < p.groupsData.length; i += groupsPerPage) {
                chunks.push(p.groupsData.slice(i, i + groupsPerPage));
            }

            chunks.forEach((chunk, chunkIdx) => {
                printHtml += `<div class="page-break-print">`;
                printHtml += `
                <div class="flex justify-between items-start w-full mb-2 text-xs">
                    <div class="w-1/3 text-left">
                        <div class="font-bold">"ПОГОДЖЕНО"</div>
                        ${getSigPrintHtml('sigTopL', meta.sigTopL)}
                    </div>
                    <div class="w-1/3 text-center">
                        <div class="text-lg font-bold uppercase tracking-widest">Розклад уроків</div>
                        <div class="text-xs font-medium italic">${getActiveRozkladDateString()}</div>
                    </div>
                    <div class="w-1/3 text-right">
                        <div class="font-bold pr-12">"ЗАТВЕРДЖУЮ"</div>
                        ${getSigPrintHtml('sigTopR', meta.sigTopR, window.formatApprDate(meta.approvalDate))}
                    </div>
                </div>`;

                printHtml += generateRegTable(chunk, true);

                let chunkComments = getRegCommentsHtml(chunk);
                if (chunkComments) {
                    printHtml += `<div class="mt-2 text-xs"><strong>Коментарі:</strong><br>${chunkComments}</div>`;
                }

                printHtml += `
                <div class="flex justify-between w-full mt-4 text-xs">
                    <div class="text-left">${getSigPrintHtml('sigBot1', meta.sigBot1)}</div>
                    <div class="text-left">${getSigPrintHtml('sigBot2', meta.sigBot2)}</div>
                    <div class="text-left">${getSigPrintHtml('sigBot3', meta.sigBot3)}</div>
                </div></div>`;
            });
            printHtml += '</div>';

            document.getElementById('rozklad-table-container').innerHTML = screenHtml + printHtml;
        }

        function getTableGrid(table) {
            let grid = [];
            for (let r = 0; r < table.rows.length; r++) {
                let tr = table.rows[r];
                if (!grid[r]) grid[r] = [];
                let cIdx = 0;
                for (let c = 0; c < tr.cells.length; c++) {
                    let td = tr.cells[c];
                    while (grid[r][cIdx]) cIdx++; 
                    let rSpan = parseInt(td.getAttribute('rowspan')) || 1;
                    let cSpan = parseInt(td.getAttribute('colspan')) || 1;
                    for (let y = 0; y < rSpan; y++) {
                        for (let x = 0; x < cSpan; x++) {
                            if (!grid[r + y]) grid[r + y] = [];
                            grid[r + y][cIdx + x] = td;
                        }
                    }
                    cIdx += cSpan;
                }
            }
            return grid;
        }

        function getCellCoords(grid, td) {
            for (let y = 0; y < grid.length; y++) {
                for (let x = 0; x < grid[y].length; x++) { if (grid[y][x] === td) return {x, y}; }
            }
            return null;
        }

        function clearSelection() {
            selectedCells.forEach(id => {
                let td = document.getElementById(id);
                if(td) td.classList.remove('selected-cell');
            });
            selectedCells.clear();
        }

        function selectCell(td) {
            if(!td.id) td.id = 'temp_' + Date.now() + Math.random();
            selectedCells.add(td.id);
            td.classList.add('selected-cell');
            if(selectedCells.size === 1) {
                let inp = td.querySelector('input');
                if(inp) inp.focus();
            }
        }

        function selectBox(sTd, eTd) {
            clearSelection();
            let table = sTd.closest('table');
            if (!table || table !== eTd.closest('table')) return;
            let grid = getTableGrid(table);
            let p1 = getCellCoords(grid, sTd);
            let p2 = getCellCoords(grid, eTd);
            if (!p1 || !p2) return;
            let minX = Math.min(p1.x, p2.x), maxX = Math.max(p1.x, p2.x);
            let minY = Math.min(p1.y, p2.y), maxY = Math.max(p1.y, p2.y);
            
            for(let y = minY; y <= maxY; y++) {
                for(let x = minX; x <= maxX; x++) {
                    let cell = grid[y][x];
                    if(cell && cell.classList.contains('selectable-cell') && !selectedCells.has(cell.id)) {
                        selectCell(cell);
                    }
                }
            }
        }

        document.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; 
            let td = e.target.closest('.selectable-cell');
            if (td) {
                isDragging = true;
                if (!e.ctrlKey && !e.shiftKey) clearSelection();
                startCell = td; 
                selectCell(td);
            } else if (!e.target.closest('#oper-group-dropdown') && !e.target.closest('#reg-subj-dropdown') && !e.target.closest('button') && !e.target.closest('#prymitky-modal') && !e.target.closest('#reg-comment-modal') && !e.target.closest('select')) {
                clearSelection();
            }
        });

        document.addEventListener('mouseover', (e) => {
            if (isDragging && startCell) {
                let td = e.target.closest('.selectable-cell');
                if (td) selectBox(startCell, td);
            }
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const ddOper = document.getElementById('oper-group-dropdown');
                const ddReg = document.getElementById('reg-subj-dropdown');
                ddOper.classList.add('hidden');
                ddReg.classList.add('hidden');
                
                if (activeOperInput) {
                    activeOperInput.blur();
                    activeOperInput = null;
                }
                clearSelection();
                return;
            }

            if (!p.HAS_LICENSE) return;
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedCells.size > 0) {
                    if (e.key === 'Backspace' && selectedCells.size === 1 && document.activeElement.tagName === 'INPUT') return;
                    
                    e.preventDefault();
                    
                    selectedCells.forEach(id => {
                        let td = document.getElementById(id);
                        if(td) {
                            let input = td.querySelector('input');
                            if (input && input.value !== '') {
                                input.value = '';
                                let cellKey = input.getAttribute('data-key');
                                if (cellKey) window.saveRozklad(cellKey, '');
                            }

                            if (window.rozkladViewMode === 'reg') {
                                let gId = td.dataset.groupid;
                                let dIdx = td.dataset.didx;
                                let lIdx = td.dataset.lidx;
                                if (gId !== undefined && dIdx !== undefined && lIdx !== undefined && td.classList.contains('reg-subj-cell')) {
                                    window.saveRozklad(`subj_${gId}_${dIdx}_${lIdx}`, '');
                                }
                            }
                        }
                    });
                }
            }

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                let activeElement = document.activeElement;
                if (activeElement && activeElement.tagName === 'INPUT' && activeElement.closest('.selectable-cell')) {
                    let currentTd = activeElement.closest('td');
                    let currentTr = currentTd.closest('tr');
                    let tbody = currentTr.closest('tbody');
                    if (!tbody) return;

                    let allRows = Array.from(tbody.querySelectorAll('tr'));
                    let rowIndex = allRows.indexOf(currentTr);
                    let allCellsInRow = Array.from(currentTr.querySelectorAll('.selectable-cell'));
                    let cellIndex = allCellsInRow.indexOf(currentTd);

                    let nextInput = null;

                    if (e.key === 'ArrowRight' && cellIndex < allCellsInRow.length - 1) {
                        nextInput = allCellsInRow[cellIndex + 1].querySelector('input');
                    } else if (e.key === 'ArrowLeft' && cellIndex > 0) {
                        nextInput = allCellsInRow[cellIndex - 1].querySelector('input');
                    } else if (e.key === 'ArrowDown' && rowIndex < allRows.length - 1) {
                        let nextRowCells = Array.from(allRows[rowIndex + 1].querySelectorAll('.selectable-cell'));
                        if (nextRowCells[cellIndex]) nextInput = nextRowCells[cellIndex].querySelector('input');
                    } else if (e.key === 'ArrowUp' && rowIndex > 0) {
                        let prevRowCells = Array.from(allRows[rowIndex - 1].querySelectorAll('.selectable-cell'));
                        if (prevRowCells[cellIndex]) nextInput = prevRowCells[cellIndex].querySelector('input');
                    }

                    if (nextInput) {
                        e.preventDefault(); 
                        clearSelection();
                        selectCell(nextInput.closest('td'));
                        nextInput.select();
                    }
                }
            }
        });

        document.addEventListener('paste', (e) => {
            if (!p.HAS_LICENSE) return; 
            let activeTd = null;
            if (document.activeElement.tagName === 'INPUT' && document.activeElement.closest('td')) activeTd = document.activeElement.closest('td');
            else if (selectedCells.size === 1) activeTd = document.getElementById(Array.from(selectedCells)[0]);
            else if (selectedCells.size > 0 && startCell) {
                let grid = getTableGrid(startCell.closest('table')); let minX = Infinity, minY = Infinity;
                selectedCells.forEach(id => {
                    let td = document.getElementById(id);
                    if(td) { let coords = getCellCoords(grid, td); if(coords && (coords.y < minY || (coords.y === minY && coords.x < minX))) { minY = coords.y; minX = coords.x; activeTd = td; } }
                });
            }
            if (!activeTd) return;
            
            let grid = getTableGrid(activeTd.closest('table')); let start = getCellCoords(grid, activeTd); if (!start) return;
            e.preventDefault();
            let text = (e.clipboardData || window.clipboardData).getData('text');
            let rows = text.split(/\r?\n/); let isMultiSelect = selectedCells.size > 1;
            
            rows.forEach((rowText, rOffset) => {
                if (!rowText.trim() && rOffset === rows.length - 1) return;
                let cols = rowText.split('\t'); let targetY = start.y + rOffset;
                if (targetY >= grid.length) return;
                cols.forEach((val, cOffset) => {
                    let targetX = start.x + cOffset; if (targetX >= grid[targetY].length) return;
                    let targetCell = grid[targetY][targetX];
                    if (isMultiSelect && (!targetCell || !selectedCells.has(targetCell.id))) return;
                    
                    if (targetCell && targetCell.querySelector('input')) {
                        let input = targetCell.querySelector('input'); if (input.disabled) return;
                        let cellKey = input.getAttribute('data-key');
                        let cleanVal = val.trim();
                        input.value = cleanVal;
                        if (cellKey) window.saveRozklad(cellKey, cleanVal);
                    }
                });
            });
        });

        window.exportToExcelJS = async function() {
            const daysConfig = getDaysConfig();
            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet(window.rozkladViewMode === 'oper' ? 'Оперативний' : 'Звичайний');
            const tableElement = document.getElementById('table-export');
            
            tableElement.querySelectorAll('input').forEach(inp => { inp.setAttribute('value', inp.value); });
            const tableClone = tableElement.cloneNode(true);
            
            tableClone.querySelectorAll('.print-hide').forEach(e => e.remove());
            tableClone.querySelectorAll('.print-block').forEach(e => e.classList.remove('hidden'));

            const rows = tableClone.querySelectorAll('tr');
            
            let offsetR = window.rozkladViewMode === 'oper' ? 2 : 0;
            let totalCols = 0;
            
            if (window.rozkladViewMode === 'oper') {
                if(rows.length > 0) { rows[0].querySelectorAll('th, td').forEach(c => totalCols += parseInt(c.getAttribute('colspan')) || 1); }
                ws.mergeCells(1, 1, 1, totalCols);
                
                let headerDate = getActiveRozkladDateString();
                if (headerDate === 'Розклад уроків') {
                    let activeRozklad = document.querySelector(`.rozklad-sub-tab[data-ridx="${window.currentRozkladIndex}"]`)?.innerText || 'Розклад';
                    headerDate = `Розклад уроків (${activeRozklad})`;
                }
                
                let cell1 = ws.getCell(1, 1);
                cell1.value = `${headerDate}\n${p.INSTITUTION_NAME} на ${p.CURRENT_YEAR} н.р.`;
                cell1.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                cell1.font = { name: 'Times New Roman', size: 12, bold: true, italic: true };
            }

            let matrix = [];
            let visibleRows = Array.from(rows).filter(r => r.style.display !== 'none');
            
            visibleRows.forEach((tr, rIdx) => {
                let cIdx = 0;
                const cells = tr.querySelectorAll('th, td');
                
                cells.forEach(cell => {
                    while(matrix[rIdx] && matrix[rIdx][cIdx]) { cIdx++; }
                    let rSpan = parseInt(cell.getAttribute('rowspan')) || 1; let cSpan = parseInt(cell.getAttribute('colspan')) || 1;
                    for(let r = 0; r < rSpan; r++) { for(let c = 0; c < cSpan; c++) { if(!matrix[rIdx + r]) matrix[rIdx + r] = []; matrix[rIdx + r][cIdx + c] = true; } }
                    
                    const targetRow = offsetR + rIdx + 1; const targetCol = cIdx + 1;
                    const excelCell = ws.getCell(targetRow, targetCol);
                    if (rSpan > 1 || cSpan > 1) ws.mergeCells(targetRow, targetCol, targetRow + rSpan - 1, targetCol + cSpan - 1);
                    
                    let val = '';
                    const input = cell.querySelector('input');
                    if (input) val = input.getAttribute('value') || input.value;
                    else {
                        let clone = cell.cloneNode(true);
                        clone.querySelectorAll('span.text-slate-300').forEach(e => e.remove());
                        val = clone.innerText.trim();
                    }
                    
                    if (tr.closest('tfoot') || tr.classList.contains('constructor-row')) {
                        excelCell.value = val;
                        let aHor = tr.classList.contains('constructor-row') ? (cIdx === 0 ? 'left' : (cIdx + cSpan >= matrix[rIdx].length ? 'right' : 'center')) : 'left';
                        excelCell.alignment = { vertical: 'top', horizontal: aHor, wrapText: true };
                        excelCell.font = { name: 'Arial', size: 9 };
                        if (tr.classList.contains('constructor-row')) excelCell.border = undefined;
                        return;
                    }

                    excelCell.value = val;
                    
                    let argb = 'FFFFFFFF'; const classStr = (cell.className + ' ' + tr.className + ' ' + (input ? input.className : ''));
                    if(classStr.includes('bg-slate-200')) argb = 'FFE2E8F0';
                    else if(classStr.includes('bg-slate-100')) argb = 'FFF1F5F9';
                    else if(classStr.includes('bg-slate-50')) argb = 'FFF8FAFC';
                    else if(classStr.includes('bg-indigo-100')) argb = 'FFE0E7FF';
                    else if(classStr.includes('bg-yellow-100') || classStr.includes('bg-yellow-50')) argb = 'FFFEFCE8';
                    else if(classStr.includes('!bg-pink-100') || classStr.includes('!bg-red-200')) argb = 'FFFCE7F3';
                    else if(classStr.includes('!bg-[#dcfce7]')) argb = 'FFDCFCE7';
                    
                    if(argb !== 'FFFFFFFF') excelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } };
                    
                    let bTop = 'thin'; let bLeft = 'thin'; let bBottom = 'thin'; let bRight = 'thin';
                    if (classStr.includes('!border-r-2') || classStr.includes('border-r-[1.5px] border-black')) bRight = 'medium';
                    if (classStr.includes('border-b-2 border-slate-800') || classStr.includes('border-b-[1.5px] border-black')) bBottom = 'medium';
                    
                    excelCell.border = { top: {style:bTop}, left: {style:bLeft}, bottom: {style:bBottom}, right: {style:bRight} };
                    
                    let isBold = cell.tagName === 'TH' || classStr.includes('font-bold'); let fontColor = 'FF000000';
                    if(classStr.includes('text-indigo-900') || classStr.includes('text-indigo-700')) fontColor = 'FF312E81';
                    if(classStr.includes('text-green-800')) fontColor = 'FF166534';
                    if(classStr.includes('text-pink-800') || classStr.includes('text-red-900')) fontColor = 'FF9D174D';
                    if(classStr.includes('text-slate-600')) fontColor = 'FF475569';
                    
                    excelCell.font = { bold: isBold, color: { argb: fontColor }, size: 9, name: 'Arial', italic: classStr.includes('italic') };
                    let align = { vertical: 'middle', horizontal: 'center', wrapText: true };
                    if(classStr.includes('text-left') || classStr.includes('text-right')) align.horizontal = classStr.includes('text-left') ? 'left' : 'right';
                    if(cell.style.writingMode === 'vertical-rl' || classStr.includes('writing-vertical')) align.textRotation = 90;
                    excelCell.alignment = align;
                });
            });
            
            if (window.rozkladViewMode === 'oper') {
                ws.columns.forEach((col, i) => { if(i===0) col.width=4; else if(i===1) col.width=25; else col.width=6; });
            } else {
                ws.columns.forEach((col, i) => { if(i===0||i===1) col.width=4; else if(i===2) col.width=10; else if((i-3)%3===0) col.width=14; else if((i-3)%3===1) col.width=5; else col.width=12; });
            }
            
            const buffer = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Розклад_${p.CURRENT_YEAR}.xlsx`);
        };

        document.addEventListener('DOMContentLoaded', () => {
            if(p.groupsData && p.groupsData.length > 0) window.onDataUpdated();
        });

    </script>
</body>
