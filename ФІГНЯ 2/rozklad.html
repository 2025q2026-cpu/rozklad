<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { background: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        .table-wrapper { border-top: 1px solid #94a3b8; border-left: 1px solid #94a3b8; }
        .excel-table { border-collapse: separate; border-spacing: 0; width: 100%; user-select: none; }
        .excel-table th, .excel-table td { border-bottom: 1px solid #94a3b8; border-right: 1px solid #94a3b8; padding: 2px; }
        
        /* ЖОРСТКА ФІКСАЦІЯ КОЛОНОК (ОПЕРАТИВНИЙ) */
        .op-num { width: 35px; min-width: 35px; max-width: 35px; left: 0; position: sticky; z-index: 60; }
        .op-tch { width: 220px; min-width: 220px; max-width: 220px; left: 35px; position: sticky; z-index: 60; transition: all 0.3s ease; }
        
        /* ЖОРСТКА ФІКСАЦІЯ КОЛОНОК (ЗВИЧАЙНИЙ) */
        .reg-day { width: 35px; min-width: 35px; max-width: 35px; left: 0; position: sticky; z-index: 60; }
        .reg-num { width: 35px; min-width: 35px; max-width: 35px; left: 35px; position: sticky; z-index: 60; }
        .reg-time { width: 90px; min-width: 90px; max-width: 90px; left: 70px; position: sticky; z-index: 60; }

        .z-top-left { z-index: 80 !important; } 
		.z-top { z-index: 70 !important; } 
		.z-left { z-index: 60 !important; }   
        
        input[type="text"] { -moz-appearance: textfield; }
        
        .selected-cell { box-shadow: inset 0 0 0 2px #4f46e5 !important; background-color: #e0e7ff !important; }
        .selected-cell input { background-color: #e0e7ff !important; }

        .comment-triangle {
            position: absolute; bottom: 0; right: 0;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-bottom-width: 8px; border-bottom-style: solid;
            z-index: 10; pointer-events: none;
        }

        .print-hide { display: block; }

       /* CSS ДЛЯ ДРУКУ */
        @media print { 
            @page { size: landscape; margin: 4mm; }
            body { background: white; padding: 0 !important; margin: 0 !important; overflow: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-hide { display: none !important; } 
            .print-block { display: block !important; }
            .print-hide-strict { display: none !important; }
            .print-table-row { display: table-row !important; }
            .print-page-break-before { page-break-before: always !important; break-before: page !important; }
            
            html, body, #mode-rozklad, #rozklad-table-container { 
                height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; position: static !important;
            }
            
            .table-wrapper { border: none !important; overflow: visible !important; height: auto !important; }
            .excel-table { width: 100% !important; table-layout: fixed; border-collapse: collapse !important; }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; }
            
            .excel-table th, .excel-table td { border: 1px solid #000 !important; color: #000 !important; padding: 1px !important; font-size: 8px !important; line-height: 1.1 !important; }
            input[type="text"] { border: none; background: transparent; pointer-events: none; color: #000; font-size: 9px !important; padding: 0 !important; width: 100%; text-align: center; }
            
            .op-num, .op-tch, .reg-day, .reg-num, .reg-time { position: static !important; left: auto !important; top: auto !important; bottom: auto !important; z-index: auto !important; box-shadow: none !important; border: 1px solid #000 !important; }
            
            .selected-cell { box-shadow: none !important; background-color: transparent !important; }
            
            .page-break-print { page-break-after: always; width: 100%; margin-bottom: 0 !important; }
            .page-break-print:last-child { page-break-after: auto; }

            .truncate-print {
                white-space: nowrap !important;
                overflow: hidden !important;
                text-overflow: ellipsis !important;
                display: block;
                width: 100%;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-slate-700">

    <!-- ПІДМЕНЮ -->
    <div id="submenu-rozklad" class="px-4 flex justify-between items-center text-sm font-medium text-slate-500 shrink-0 border-b border-slate-200 pb-2 print-hide bg-white/50 pt-2 rounded-t-xl z-50 relative">
        <div class="flex items-center gap-4 w-1/2">
            <div class="flex bg-slate-200 p-1 rounded-lg shrink-0 shadow-inner">
                <button id="toggle-oper" onclick="window.setRozkladMode('oper')" class="px-3 py-1 rounded-md text-sm font-bold bg-white text-indigo-700 shadow-sm transition-all">Оперативний</button>
                <button id="toggle-reg" onclick="window.setRozkladMode('reg')" class="px-3 py-1 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all">Звичайний</button>
            </div>
            <div id="rozklad-tabs" class="flex gap-2 overflow-x-auto items-center pb-1 flex-1 custom-scrollbar"></div>
        </div>
        <div class="flex gap-2 shrink-0 items-center">
            
            <div id="lunch-selector-container" class="hidden items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mr-2">
                <label class="font-bold text-slate-600 text-xs">Обід після:</label>
                <select id="lunch-select" class="border border-slate-300 rounded p-1 outline-none text-xs bg-white" onchange="window.saveRozkladMeta('lunchAfter', this.value)">
                    <option value="0">Немає</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>

            <button id="btn-prymitky" onclick="window.openPrymitkyModal()" class="px-3 py-1.5 bg-yellow-50 hover:bg-yellow-100 text-yellow-700 rounded-lg shadow-sm transition-colors border border-yellow-200"><i class="fa-solid fa-pen-to-square mr-1"></i> Примітки</button>
            <button id="btn-reg-comments" onclick="window.openRegCommentModal()" class="hidden px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-lg shadow-sm transition-colors border border-amber-200"><i class="fa-solid fa-comment-dots mr-1"></i> Коментар</button>
            
            <div class="w-px bg-slate-300 mx-1 h-6 self-center"></div>
            <button onclick="exportToExcelJS()" class="px-3 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg shadow-sm transition-colors border border-green-200"><i class="fa-solid fa-file-excel mr-1"></i> Excel</button>
            <button onclick="window.openPrintSettings()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg shadow-sm transition-colors border border-slate-300"><i class="fa-solid fa-print mr-1"></i> Друк</button>
        </div>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ ТАБЛИЦІ -->
    <div id="mode-rozklad" class="flex-1 flex flex-col overflow-hidden h-full w-full relative select-none">
        <div id="rozklad-table-container" class="flex-1 flex flex-col overflow-hidden w-full relative"></div>
    </div>

    <div id="oper-group-dropdown" class="fixed hidden bg-white border border-slate-300 shadow-2xl z-[150] w-56 rounded-xl flex flex-col text-sm overflow-hidden py-1">
        <div id="oper-group-list" class="max-h-64 overflow-y-auto divide-y divide-slate-100 bg-white custom-scrollbar"></div>
    </div>

    <div id="reg-subj-dropdown" class="fixed hidden bg-white border border-slate-300 shadow-2xl z-[150] w-64 rounded-xl flex flex-col text-sm overflow-hidden py-1">
        <div id="reg-subj-list" class="max-h-64 overflow-y-auto divide-y divide-slate-100 bg-white custom-scrollbar"></div>
    </div>

    <div id="prymitky-modal" class="fixed inset-0 bg-slate-900/50 hidden z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden">
            <div class="p-4 border-b bg-yellow-50 font-bold text-yellow-800 flex items-center"><i class="fa-solid fa-pen-to-square mr-2"></i>Примітки до цього розкладу</div>
            <div class="p-4 flex flex-col gap-3">
                <textarea id="prymitky-text" rows="5" class="w-full border border-slate-300 rounded p-2 text-sm outline-none focus:border-yellow-500" placeholder="Введіть текст приміток, який буде відображатись під таблицею..."></textarea>
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                <button onclick="document.getElementById('prymitky-modal').classList.add('hidden')" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Скасувати</button>
                <button onclick="window.savePrymitky()" class="px-4 py-1.5 bg-yellow-500 text-white rounded-lg text-sm font-bold hover:bg-yellow-600 transition-colors shadow-sm">Зберегти</button>
            </div>
        </div>
    </div>

    <div id="reg-comment-modal" class="fixed inset-0 bg-slate-900/50 hidden z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-96 overflow-hidden">
            <div class="p-4 border-b bg-amber-50 font-bold text-amber-800 flex items-center"><i class="fa-solid fa-comment-dots mr-2"></i>Коментар до комірок</div>
            <div class="p-4 flex flex-col gap-3">
                <textarea id="reg-comment-text" rows="3" class="w-full border border-slate-300 rounded p-2 text-sm outline-none focus:border-amber-500" placeholder="Введіть текст коментаря..."></textarea>
                <div class="flex items-center gap-3 mt-2">
                    <label class="text-sm font-medium text-slate-600">Колір маркера:</label>
                    <input type="color" id="reg-comment-color" value="#f59e0b" class="w-8 h-8 rounded border-0 p-0 cursor-pointer">
                </div>
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 flex justify-between gap-2">
                <button id="btn-delete-reg-comment" onclick="window.deleteRegComment()" class="px-4 py-1.5 rounded-lg text-sm font-bold text-red-600 hover:bg-red-50 transition-colors hidden"><i class="fa-solid fa-trash mr-1"></i> Видалити</button>
                <div class="flex gap-2 ml-auto">
                    <button onclick="document.getElementById('reg-comment-modal').classList.add('hidden')" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Скасувати</button>
                    <button onclick="window.saveRegComment()" class="px-4 py-1.5 bg-amber-500 text-white rounded-lg text-sm font-bold hover:bg-amber-600 transition-colors shadow-sm">Зберегти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- НОВЕ МОДАЛЬНЕ ВІКНО НАЛАШТУВАНЬ ДРУКУ -->
    <div id="print-settings-modal" class="fixed inset-0 bg-slate-900/50 hidden z-[200] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-96 overflow-hidden">
            <div class="p-4 border-b bg-slate-100 font-bold text-slate-800 flex items-center"><i class="fa-solid fa-print mr-2"></i>Налаштування друку (Звичайний)</div>
            <div class="p-4 flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Орієнтація аркуша:</label>
                    <select id="print-orientation" class="w-full border border-slate-300 rounded p-2 text-sm outline-none focus:border-indigo-500">
                        <option value="landscape">Альбомна (Landscape)</option>
                        <option value="portrait">Книжкова (Portrait)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Кількість груп на аркуші:</label>
                    <input type="number" id="print-groups-per-page" value="5" min="1" max="10" class="w-full border border-slate-300 rounded p-2 text-sm outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="p-3 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                <button onclick="document.getElementById('print-settings-modal').classList.add('hidden')" class="px-4 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-colors">Скасувати</button>
                <button onclick="window.executeRegPrint()" class="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition-colors shadow-sm">Друкувати</button>
            </div>
        </div>
    </div>

    <script type="module">
        const p = window.parent; 

        window.rozkladData = {};
        window.rozkladViewMode = localStorage.getItem('fignia_rozklad_mode') || 'oper';
        window.currentRozkladIndex = null;
        window.currentAllocations = {};
        window.rozkladSaveTimeouts = {};

        // НОВІ ЗМІННІ ТА ФУНКЦІЇ ДЛЯ ДРУКУ
        window.currentPrintGroupsPerPage = 5;

        window.openPrintSettings = function() {
            if (window.rozkladViewMode === 'oper') {
                window.print(); // Оперативний друкується як раніше
            } else {
                document.getElementById('print-settings-modal').classList.remove('hidden');
            }
        };

        window.executeRegPrint = function() {
            let orientation = document.getElementById('print-orientation').value;
            window.currentPrintGroupsPerPage = parseInt(document.getElementById('print-groups-per-page').value) || 5;
            
            // Динамічне правило для орієнтації сторінки
            let style = document.getElementById('dynamic-print-style');
            if (!style) {
                style = document.createElement('style');
                style.id = 'dynamic-print-style';
                document.head.appendChild(style);
            }
            style.innerHTML = `@media print { @page { size: ${orientation} !important; margin: 4mm; } }`;
            
            // Перебудовуємо таблицю
            window.renderActiveTable();
            document.getElementById('print-settings-modal').classList.add('hidden');
            
            setTimeout(() => {
                window.print();
            }, 150);
        };
        // КІНЕЦЬ НОВОГО КОДУ

        window.currentRegGrid = null;
        window.currentRegUsages = null;

        let activeOperInput = null;
        let selectedCells = new Set();
        let isDragging = false;
        let startCell = null;

        // ДИНАМІЧНА ГЕНЕРАЦІЯ ДНІВ З НАЛАШТУВАНЬ
        function getDaysConfig() {
            let s = p.generalSettings || {};
            let wDays = parseInt(s.workDays) || 5;
            let regLessons = parseInt(s.lessonsRegular) || 8;
            let lastLessons = parseInt(s.lessonsLast) || 6;
            
            let config = [];
            const dayNames = ['ПОНЕДІЛОК', 'ВІВТОРОК', 'СЕРЕДА', 'ЧЕТВЕР', 'П’ЯТНИЦЯ', 'СУБОТА'];
            
            for (let i = 0; i < wDays; i++) {
                let count = (i === wDays - 1) ? lastLessons : regLessons;
                config.push({ name: dayNames[i], count: count });
            }
            return config;
        }

        window.onDataUpdated = function() {
            initRozklads();
            const activeEl = document.activeElement;
            const isTyping = activeEl && activeEl.tagName === 'INPUT';
            
            if (isTyping && window.rozkladViewMode === 'oper') {
                window.currentAllocations = calculateAllocations(window.currentRozkladIndex);
                window.validateOperatyvny();
            } else if(!isTyping) {
                window.renderActiveTable();
            }
        };

        function initRozklads() {
            if(!p.ekranData || !p.groupsData) return;

            let maxRozklads = 0;
            for (let gId in p.ekranData) {
                let rCount = (p.ekranData[gId].rozklads || []).length;
                if (rCount > maxRozklads) maxRozklads = rCount;
            }
            
            let html = '';
            for(let i = 0; i < maxRozklads; i++) {
                let rName = `Розклад ${i + 1}`;
                for (let gId in p.ekranData) {
                    let r = p.ekranData[gId].rozklads?.[i];
                    if (r && r.name && !r.name.toLowerCase().startsWith('розклад')) {
                        rName = r.name;
                        break;
                    }
                }
                html += `<button class="rozklad-sub-tab px-3 py-1.5 rounded-lg text-sm font-medium transition-colors text-slate-500 hover:bg-slate-100" data-ridx="${i}" onclick="window.selectRozklad(${i}, this)">${rName}</button>`;
            }
            document.getElementById('rozklad-tabs').innerHTML = html;
            
            if (maxRozklads === 0) {
                document.getElementById('rozklad-table-container').innerHTML = '<div class="p-8 text-center text-slate-500">Спочатку створіть розклади на вкладці "Екран".</div>';
                return;
            }
            
            if (window.currentRozkladIndex === null || window.currentRozkladIndex >= maxRozklads) {
                window.currentRozkladIndex = 0;
            }
            
            let activeBtn = document.querySelector(`.rozklad-sub-tab[data-ridx="${window.currentRozkladIndex}"]`);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-500');
                activeBtn.classList.add('bg-indigo-100', 'text-indigo-700', 'font-bold', 'shadow-sm');
            }

            for (let rIdx = 0; rIdx < maxRozklads; rIdx++) {
                let sData = p.rozkladData ? (p.rozkladData[`rozklad_${rIdx}`] || {}) : {};
                if (!sData.oper) sData.oper = {};
                if (!sData.reg) sData.reg = {};
                if (!sData.times) sData.times = {};
                if (!sData.meta) sData.meta = {};
                if (!sData.prymitky) sData.prymitky = '';
                if (!sData.comments) sData.comments = {}; 
                window.rozkladData[rIdx] = JSON.parse(JSON.stringify(sData)); 
            }
            
            window.setRozkladMode(window.rozkladViewMode, true);
        }

        window.selectRozklad = function(idx, btn) {
            window.currentRozkladIndex = idx;
            document.querySelectorAll('.rozklad-sub-tab').forEach(b => {
                b.classList.remove('bg-indigo-100', 'text-indigo-700', 'font-bold', 'shadow-sm');
                b.classList.add('text-slate-500');
            });
            if(btn) {
                btn.classList.remove('text-slate-500');
                btn.classList.add('bg-indigo-100', 'text-indigo-700', 'font-bold', 'shadow-sm');
            }
            window.renderActiveTable();
        };

        window.setRozkladMode = function(mode, noRender = false) {
            window.rozkladViewMode = mode;
            localStorage.setItem('fignia_rozklad_mode', mode);
            
            const btnOper = document.getElementById('toggle-oper');
            const btnReg = document.getElementById('toggle-reg');
            const btnPrymitky = document.getElementById('btn-prymitky');
            const btnRegComments = document.getElementById('btn-reg-comments');
            const lunchSelector = document.getElementById('lunch-selector-container');

            if (mode === 'oper') {
                btnOper.className = "px-3 py-1 rounded-md text-sm font-bold bg-white text-indigo-700 shadow-sm transition-all";
                btnReg.className = "px-3 py-1 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                btnPrymitky.classList.remove('hidden');
                btnRegComments.classList.add('hidden');
                lunchSelector.classList.add('hidden');
            } else {
                btnReg.className = "px-3 py-1 rounded-md text-sm font-bold bg-white text-indigo-700 shadow-sm transition-all";
                btnOper.className = "px-3 py-1 rounded-md text-sm font-medium text-slate-500 hover:text-slate-700 transition-all";
                btnPrymitky.classList.add('hidden');
                btnRegComments.classList.remove('hidden');
                lunchSelector.classList.remove('hidden');
            }
            if (!noRender) window.renderActiveTable();
        };

        window.renderActiveTable = function() {
            if(window.currentRozkladIndex === null) return;
            
            let container = document.getElementById('rozklad-table-container');
            let wrapper = container.querySelector('.table-wrapper');
            let sTop = wrapper ? wrapper.scrollTop : 0;
            let sLeft = wrapper ? wrapper.scrollLeft : 0;

            if(window.rozkladViewMode === 'oper') renderOperatyvny();
            else renderZvychainy();

            wrapper = container.querySelector('.table-wrapper');
            if (wrapper) {
                wrapper.scrollTop = sTop;
                wrapper.scrollLeft = sLeft;
            }
        };

        window.openPrymitkyModal = function() {
            let rIdx = window.currentRozkladIndex;
            if (rIdx === null) return;
            document.getElementById('prymitky-text').value = window.rozkladData[rIdx]?.prymitky || '';
            document.getElementById('prymitky-modal').classList.remove('hidden');
        };

        window.savePrymitky = function() {
            let rIdx = window.currentRozkladIndex;
            if (rIdx === null) return;
            let text = document.getElementById('prymitky-text').value.trim();
            
            if(!window.rozkladData[rIdx]) window.rozkladData[rIdx] = { oper: {}, reg: {}, times: {}, meta: {}, comments: {} };
            window.rozkladData[rIdx].prymitky = text;
            
            if(p.api && p.api.saveRozklad) p.api.saveRozklad(`rozklad_${rIdx}`, { prymitky: text });
            
            document.getElementById('prymitky-modal').classList.add('hidden');
            window.renderActiveTable(); 
        };

        window.formatApprDate = function(dateStr) {
            if (!dateStr) return '';
            let parts = dateStr.split('-');
            if (parts.length === 3) {
                const months = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
                return `${parseInt(parts[2], 10)} ${months[parseInt(parts[1], 10)-1]} ${parts[0]} року`;
            }
            return dateStr;
        };

        window.getSigOptions = function() {
            const s = p.generalSettings || {};
            return [
                { id: '', pos: '— Не вибрано —', name: '' },
                { id: 'dir', pos: 'Директор', name: s.dirShort || '' },
                { id: 'prof', pos: 'Голова профкому', name: s.profShort || '' },
                { id: 'dep1', pos: s.dep1Pos || 'Заст. директора', name: s.dep1Short || '' },
                { id: 'dep2', pos: s.dep2Pos || 'Заст. директора', name: s.dep2Short || '' },
                { id: 'dep3', pos: s.dep3Pos || 'Заст. директора', name: s.dep3Short || '' },
                { id: 'meth', pos: s.methPos || 'Методист', name: s.methShort || '' },
                { id: 'stud', pos: s.studprofPos || 'Голова учпрофкому', name: s.studprofShort || '' }
            ];
        };

        function buildSigSelect(key, currentVal, extraVal = '') {
            let sigs = window.getSigOptions();
            if (!p.HAS_LICENSE) {
                if (!currentVal || currentVal === '') return '';
                if (key === 'sigTopR') {

        function getRozkladBlocks(groupId) {
            let eData = p.ekranData[groupId] || { rozklads: [] };
            let rozklads = eData.rozklads || [];
            let currDate = p.generalSettings.sem1Start ? new Date(p.generalSettings.sem1Start) : null;
            let sem1EndDate = p.generalSettings.sem1End ? new Date(p.generalSettings.sem1End) : null;
            let sem2StartDate = p.generalSettings.sem2Start ? new Date(p.generalSettings.sem2Start) : null;
            let sem2EndDate = p.generalSettings.sem2End ? new Date(p.generalSettings.sem2End) : null;
            
            let blocks = []; let globalIdx = 0;
            rozklads.forEach((r, rIdx) => {
                let block = { rId: r.id, name: r.name, weeks: [], cols: r.cols };
                r.cols.forEach(col => {
                    let wCount = parseFloat(col.weeks) || 0;
                    for(let i=0; i<wCount; i++) {
                        let weekStart = currDate ? new Date(currDate) : null;
                        let weekEnd = null;

                        if (weekStart) {
                            weekEnd = new Date(weekStart);
                            while (weekEnd.getDay() !== 5) { weekEnd.setDate(weekEnd.getDate() + 1); }
                            if (sem1EndDate && weekStart.getTime() <= sem1EndDate.getTime() && weekEnd.getTime() > sem1EndDate.getTime()) weekEnd = new Date(sem1EndDate);
                            else if (sem2EndDate && weekStart.getTime() <= sem2EndDate.getTime() && weekEnd.getTime() > sem2EndDate.getTime()) weekEnd = new Date(sem2EndDate);
                        }

                        block.weeks.push({ globalIndex: globalIdx++, startDateObj: weekStart ? new Date(weekStart) : null, dateObj: weekEnd ? new Date(weekEnd) : null });
                        
                        if (weekEnd) {
                            if (sem1EndDate && sem2StartDate && weekEnd.getTime() >= sem1EndDate.getTime() && weekStart.getTime() <= sem1EndDate.getTime()) {
                                currDate = new Date(sem2StartDate);
                            } else {
                                currDate = new Date(weekEnd); currDate.setDate(currDate.getDate() + 1);
                                while (currDate.getDay() !== 1) currDate.setDate(currDate.getDate() + 1);
                            }
                        }
                    }
                });
                blocks.push(block);
            });
            return blocks;
        }

        function getActiveRozkladDateString() {
            if(!p.groupsData || p.groupsData.length === 0) return "Розклад уроків";
            let gId = p.groupsData[0].id;
            let blocks = getRozkladBlocks(gId);
            let currentBlock = blocks.find(b => b.rId === p.ekranData[gId]?.rozklads?.[window.currentRozkladIndex]?.id);
            if (!currentBlock || currentBlock.weeks.length === 0) return "Розклад уроків";

            let firstWeek = currentBlock.weeks[0];
            let lastWeek = currentBlock.weeks[currentBlock.weeks.length - 1];

            let startDate = firstWeek.startDateObj ? new Date(firstWeek.startDateObj) : null;
            let endDate = lastWeek.dateObj ? new Date(lastWeek.dateObj) : null;

            if (!startDate || !endDate) return "Розклад уроків";

            const months = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
            let sD = startDate.getDate().toString().padStart(2, '0');
            let sM = months[startDate.getMonth()];
            let eD = endDate.getDate().toString().padStart(2, '0');
            let eM = months[endDate.getMonth()];
            let year = endDate.getFullYear();

            return `з ${sD} ${sM} по ${eD} ${eM} ${year} року`;
        }

        function getMaxRozkladHour(groupId, subjId, rId) {
            let blocks = getRozkladBlocks(groupId);
            let block = blocks.find(b => b.rId === rId);
            if (!block) return 0;
            
            let vData = p.vychytkaData[groupId]?.hours || {};
            let maxH = 0;
            for(let w of block.weeks) {
                let h = parseFloat(vData[`${subjId}_w${w.globalIndex}`]?.rozklad) || 0;
                if (h > maxH) maxH = h;
            }
            return maxH;
        }

        function getGroupSubjectsWithIds(groupId) {
            const group = p.groupsData.find(g => g.id === groupId); 
            if (!group) return [];
            let groupSubjects = [];
            const addSubj = (sId, tId1, tId2) => { groupSubjects.push({ id: sId, teacherId: tId1, teacherId2: tId2 }); };
            
            if (group.education.includes('Базова')) {
                p.genSubjectsData.forEach(subj => {
                    let tMain = p.workloadMap[`gen_${subj.id}_${groupId}`]?.teacherId;
                    let tSplit = subj.isSplit ? p.workloadMap[`gen_${subj.id}_split_${groupId}`]?.teacherId : null;
                    let teachers = [tMain, tSplit].filter(Boolean);
                    let uniqueT = [...new Set(teachers)];
                    uniqueT.forEach(tId => addSubj(`gen_${subj.id}`, tId, null));
                });
            }

            p.specSubjectsAll.forEach(subj => {
                let tMain1 = p.workloadMap[`spec_${subj.id}_main_${groupId}`]?.teacherId;
                let tMain2 = p.workloadMap[`spec_${subj.id}_main_${groupId}`]?.teacherId2;
                let tSplit1 = subj.isSplit ? p.workloadMap[`spec_${subj.id}_split_${groupId}`]?.teacherId : null;
                let tSplit2 = subj.isSplit ? p.workloadMap[`spec_${subj.id}_split_${groupId}`]?.teacherId2 : null;
                
                let teachers = [tMain1, tMain2, tSplit1, tSplit2].filter(Boolean);
                let uniqueT = [...new Set(teachers)];
                uniqueT.forEach(tId => addSubj(`spec_${subj.id}`, tId, null));
            });

            return groupSubjects;
        }

        window.getTeacherGroupSubjects = function() {
            let tgs = {}; 
            p.groupsData.forEach(g => {
                let gNum = (g.num || g.name).toString();
                let subjects = getGroupSubjectsWithIds(g.id);
                subjects.forEach(s => {
                    [s.teacherId, s.teacherId2].filter(Boolean).forEach(tId => {
                        if (!tgs[tId]) tgs[tId] = {};
                        if (!tgs[tId][gNum]) tgs[tId][gNum] = new Set();
                        tgs[tId][gNum].add(s.id);
                    });
                });
            });
            return tgs;
        }

        function calculateAllocations(rIdx) {
            let alloc = {}; 
            p.groupsData.forEach(g => {
                let gNum = (g.num || g.name).toString();
                let subjects = getGroupSubjectsWithIds(g.id);
                
                let r = p.ekranData[g.id]?.rozklads?.[rIdx];
                if (!r) return;
                let groupRId = r.id;

                let uniqueSubjects = []; let seen = new Set();
                subjects.forEach(s => {
                    if (s.teacherId) { let k1 = `${s.id}_${s.teacherId}`; if(!seen.has(k1)) { seen.add(k1); uniqueSubjects.push({ id: s.id, tId: s.teacherId }); } }
                    if (s.teacherId2) { let k2 = `${s.id}_${s.teacherId2}`; if(!seen.has(k2)) { seen.add(k2); uniqueSubjects.push({ id: s.id, tId: s.teacherId2 }); } }
                });

                uniqueSubjects.forEach(s => {
                    let hours = getMaxRozkladHour(g.id, s.id, groupRId);
                    if (hours > 0 && s.tId) {
                        if (!alloc[s.tId]) alloc[s.tId] = {};
                        alloc[s.tId][gNum] = (alloc[s.tId][gNum] || 0) + hours;
                    }
                });
            });
            return alloc;
        }

        function showOperDropdown(input) {
            // НОВА ЛОГІКА ДЛЯ РЯДКІВ ВИРОБНИЧОГО НАВЧАННЯ ГРУПИ
            if (input.classList.contains('vns-group-input')) {
                let gNum = input.dataset.vnsgroupnum;
                let gId = input.dataset.vnsgroupid;
                let listHtml = `<div class="px-3 py-2 hover:bg-red-50 text-red-500 cursor-pointer font-semibold border-b border-slate-100" onclick="window.selectOperGroup('', true)"><i class="fa-solid fa-eraser mr-2"></i>Очистити комірку</div>`;

                let rId = p.ekranData[gId]?.rozklads?.[rIdx]?.id;
                let maxHours = rId ? getMaxRozkladHour(gId, 'spec_STATIC_navch', rId) : 0;
                
                let usedHours = 0;
                document.querySelectorAll(`input.vns-group-input[data-vnsgroupid="${gId}"]`).forEach(inp => {
                    if (inp.value.trim()) usedHours++;
                });
                
                let rem = maxHours - usedHours;

                let parts = input.dataset.key.split('_');
                let colSuffix = `${parts[2]}_${parts[3]}`; 
                let isBusy = false;
                
                document.querySelectorAll(`input.oper-input:not(.vns-group-input)[data-key$="_${colSuffix}"]`).forEach(inp => {
                    let val = inp.value.trim();
                    if (val) {
                        let groups = val.split(/[\/\,]/).map(s => s.trim()).filter(Boolean);
                        if (groups.includes(gNum)) isBusy = true;
                    }
                });

                if (rem > 0 && !isBusy) {
                    listHtml += `<div class="px-3 py-2 hover:bg-yellow-100 cursor-pointer flex justify-between items-center transition-colors" onclick="window.selectOperGroup('${gNum}')">
                        <span class="font-bold text-slate-700">Група ${gNum} (В/Н)</span>
                        <span class="bg-yellow-200 text-yellow-800 text-[10px] px-1.5 py-0.5 rounded ml-2 font-bold">зал: ${rem}</span>
                    </div>`;
                } else if (isBusy && rem > 0) {
                    listHtml += `<div class="px-3 py-2 bg-slate-50 flex justify-between items-center cursor-not-allowed opacity-50" title="Група вже на уроці у викладача">
                        <span class="font-bold text-slate-500">Група ${gNum}</span>
                        <i class="fa-solid fa-lock text-[10px] text-red-400"></i>
                    </div>`;
                } else {
                    listHtml += `<div class="px-3 py-2 text-slate-400 text-xs text-center italic">Всі години розподілено</div>`;
                }

                const dropdown = document.getElementById('oper-group-dropdown');
                document.getElementById('oper-group-list').innerHTML = listHtml;
                
                const rect = input.getBoundingClientRect();
                dropdown.classList.remove('hidden');
                
                const dropdownHeight = dropdown.offsetHeight || 100; 
                const dropdownWidth = dropdown.offsetWidth || 224; // Отримуємо ширину меню
                const spaceBelow = window.innerHeight - rect.bottom;
                
                // Перевірка по вертикалі
                if (spaceBelow < dropdownHeight && rect.top > dropdownHeight) {
                    dropdown.style.top = `${rect.top - dropdownHeight}px`; 
                } else {
                    dropdown.style.top = `${rect.bottom}px`;
                }
                
                // Перевірка по горизонталі (щоб не вилазило за правий край)
                let leftPos = rect.left;
                if (leftPos + dropdownWidth > window.innerWidth) {
                    leftPos = window.innerWidth - dropdownWidth - 16; // 16px відступ від краю
                }
                dropdown.style.left = `${leftPos}px`;
                return;
            }

            const tId = input.dataset.teacher;
            const key = input.dataset.key; 
            if(!tId || !key) return;

            let parts = key.split('_');
            let colSuffix = `${parts[1]}_${parts[2]}`;

            let alloc = window.currentAllocations || {};
            let tAlloc = alloc[tId] || {};
            let counts = {};
            
            let inputs = document.querySelectorAll(`input.oper-input[data-teacher="${tId}"]`);
            inputs.forEach(inp => {
                let val = inp.value.trim();
                if (!val) return;
                let groups = val.split(/[\/\,]/).map(s => s.trim()).filter(Boolean);
                groups.forEach(g => counts[g] = (counts[g] || 0) + 1);
            });

            let tgs = window.getTeacherGroupSubjects();
            let incompatibleGroupsInCol = new Set();
            let allInputsInCol = document.querySelectorAll(`input.oper-input[data-key$="_${colSuffix}"]`);
            
            allInputsInCol.forEach(inp => {
                if (inp.dataset.teacher === tId) return; 
                let val = inp.value.trim();
                if (!val) return;
                let groups = val.split(/[\/\,]/).map(s => s.trim()).filter(Boolean);
                groups.forEach(g => {
                    let s1 = tgs[tId]?.[g] || new Set();
                    let s2 = tgs[inp.dataset.teacher]?.[g] || new Set();
                    let intersection = [...s1].filter(x => s2.has(x));
                    if (intersection.length === 0) incompatibleGroupsInCol.add(g); 
                });
            });

            let listHtml = '';
            let hasAvailable = false;
            
            listHtml += `<div class="px-3 py-2 hover:bg-red-50 text-red-500 cursor-pointer font-semibold border-b border-slate-100" onclick="window.selectOperGroup('', true)"><i class="fa-solid fa-eraser mr-2"></i>Очистити комірку</div>`;

            let groupNames = Object.keys(tAlloc).sort((a,b) => a.localeCompare(b, 'uk', {numeric: true}));
            
            groupNames.forEach(g => {
                let req = Math.round(tAlloc[g] || 0);
                let c = counts[g] || 0;
                let rem = req - c;
                let isBlocked = incompatibleGroupsInCol.has(g);
                
                if (rem > 0 && !isBlocked) {
                    hasAvailable = true;
                    listHtml += `<div class="px-3 py-2 hover:bg-indigo-50 cursor-pointer flex justify-between items-center transition-colors" onclick="window.selectOperGroup('${g}')">
                        <span class="font-bold text-slate-700">Група ${g}</span>
                        <span class="bg-indigo-100 text-indigo-700 text-[10px] px-1.5 py-0.5 rounded ml-2 font-bold">зал: ${rem}</span>
                    </div>`;
                } else if (isBlocked && rem > 0) {
                    listHtml += `<div class="px-3 py-2 bg-slate-50 flex justify-between items-center cursor-not-allowed opacity-50" title="Група вже на уроці в іншого викладача">
                        <span class="font-bold text-slate-500">Група ${g}</span>
                        <i class="fa-solid fa-lock text-[10px] text-red-400"></i>
                    </div>`;
                }
            });

            if (!hasAvailable && incompatibleGroupsInCol.size === 0) {
                listHtml += `<div class="px-3 py-2 text-slate-400 text-xs text-center italic">Всі години розподілено</div>`;
            }

            const dropdown = document.getElementById('oper-group-dropdown');
            document.getElementById('oper-group-list').innerHTML = listHtml;
            
            const rect = input.getBoundingClientRect();
            dropdown.classList.remove('hidden');
            
            const dropdownHeight = dropdown.offsetHeight || 100; 
            const dropdownWidth = dropdown.offsetWidth || 224; // Отримуємо ширину меню
            const spaceBelow = window.innerHeight - rect.bottom;

            if (spaceBelow < dropdownHeight && rect.top > dropdownHeight) {
                dropdown.style.top = `${rect.top - dropdownHeight}px`; 
            } else {
                dropdown.style.top = `${rect.bottom}px`;
            }
            
            // Перевірка по горизонталі (щоб не вилазило за правий край)
            let leftPos = rect.left;
            if (leftPos + dropdownWidth > window.innerWidth) {

        window.selectOperGroup = function(g, clear = false) {

            if (clear) {
                activeOperInput.value = '';
            } else {

                if (current) {
                    if (current.includes('/')) {
                        let parts = current.split('/');
                        if (parts.length < 2) activeOperInput.value = current + '/' + g;
                        else activeOperInput.value = parts[0] + '/' + g;
                    } else {

            window.saveRozklad(activeOperInput.dataset.key, activeOperInput.value);

        window.validateOperatyvny = function() {
            if (window.rozkladViewMode !== 'oper') return;
            let alloc = window.currentAllocations || {};
            let tgs = window.getTeacherGroupSubjects();
            
            let columnGroups = {};
            let allOperInputs = document.querySelectorAll(`input.oper-input`);
            allOperInputs.forEach(inp => {
                let val = inp.value.trim();
                if (!val) return;
                
                let key = inp.dataset.key;
                let isVns = key.startsWith('vnsgrp_');
                let colKey = isVns ? key.split('_').slice(2).join('_') : key.split('_').slice(1).join('_');
                let ownerId = isVns ? 'VNS_' + key.split('_')[1] : key.split('_')[0];
                
                let groups = val.split(/[\/\,]/).map(s => s.trim()).filter(Boolean);
                if (!columnGroups[colKey]) columnGroups[colKey] = {};
                
                groups.forEach(g => {
                    if (!columnGroups[colKey][g]) columnGroups[colKey][g] = [];
                    columnGroups[colKey][g].push(ownerId);
                });
            });

            let conflictingCells = new Set();
            for (let colKey in columnGroups) {
                for (let g in columnGroups[colKey]) {
                    let owners = columnGroups[colKey][g];
                    if (owners.length > 1) {
                        let hasConflict = false;
                        for (let i = 0; i < owners.length; i++) {
                            for (let j = i + 1; j < owners.length; j++) {
                                if (owners[i].startsWith('VNS_') || owners[j].startsWith('VNS_')) {
                                    hasConflict = true;
                                } else {
                                    let s1 = tgs[owners[i]]?.[g] || new Set();
                                    let s2 = tgs[owners[j]]?.[g] || new Set();
                                    let intersection = [...s1].filter(x => s2.has(x));
                                    if (intersection.length === 0) hasConflict = true; 
                                }
                            }
                        }
                        if (hasConflict) owners.forEach(oId => {
                            if (oId.startsWith('VNS_')) conflictingCells.add(`vnsgrp_${oId.replace('VNS_','')}_${colKey}`);
                            else conflictingCells.add(`${oId}_${colKey}`);
                        });
                    }
                }
            }
            
            document.querySelectorAll('tr[data-teacher-row]').forEach(tr => {
                let tId = tr.dataset.teacherRow;
                let tAlloc = alloc[tId] || {};
                let counts = {};
                
                let inputs = tr.querySelectorAll(`input.oper-input`);
                inputs.forEach(inp => {
                    let val = inp.value.trim();
                    if (!val) return;
                    let groups = val.split(/[\/\,]/).map(s => s.trim()).filter(Boolean);
                    groups.forEach(g => counts[g] = (counts[g] || 0) + 1);
                });
                
                let isFullyAssigned = true;
                let tooltipLines = [];
                let hasAllocations = false;

                for (let g in tAlloc) {
                    let req = Math.round(tAlloc[g] || 0);
                    if (req > 0) hasAllocations = true;
                    let c = counts[g] || 0;
                    let rem = req - c;

                    if (rem > 0) {
                        isFullyAssigned = false;
                        tooltipLines.push(`Група ${g}: зал. ${rem} год.`);
                    }
                }

                let teacherCell = tr.querySelector('.op-tch');
                if (teacherCell) {
                    teacherCell.classList.remove('!bg-[#dcfce7]', 'text-green-800');
                    teacherCell.removeAttribute('title');
                    
                    if (hasAllocations) {
                        if (isFullyAssigned) {
                            teacherCell.classList.add('!bg-[#dcfce7]', 'text-green-800');
                            teacherCell.title = teacherCell.innerText; 
                        } else {
                            teacherCell.title = teacherCell.innerText + "\n\nЗалишилось виставити:\n" + tooltipLines.join('\n');
                        }
                    } else {
                        teacherCell.title = teacherCell.innerText;
                    }
                }
                
                inputs.forEach(inp => {
                    let val = inp.value.trim();
                    inp.classList.remove('!bg-pink-100', 'text-pink-800', '!bg-[#dcfce7]', 'text-green-800', 'text-slate-800', 'bg-transparent', 'focus:bg-indigo-50', '!bg-red-200', 'text-red-900');
                    inp.removeAttribute('title');

                    if (!val) {
                        inp.classList.add('bg-transparent', 'text-slate-800', 'focus:bg-indigo-50');
                        return;
                    }
                    
                    let isConflict = conflictingCells.has(inp.dataset.key);
                    let groups = val.split(/[\/\,]/).map(s => s.trim()).filter(Boolean);
                    let isOver = false;
                    let isComplete = true;
                    let hasAlloc = false;
                    
                    groups.forEach(g => {
                        let req = Math.round(tAlloc[g] || 0);
                        if (req === 0) { isOver = true; }
                        else {
                            hasAlloc = true;
                            if (counts[g] > req) isOver = true;
                            if (counts[g] < req) isComplete = false;
                        }
                    });
                    
                    if (isConflict) {
                        inp.classList.add('!bg-red-200', 'text-red-900');
                        inp.title = "Конфлікт: група призначена іншому викладачу без поділу!";
                    } else if (isOver) {
                        inp.classList.add('!bg-pink-100', 'text-pink-800');
                        inp.title = "Перевищено ліміт годин або група не призначена.";
                    } else if (isComplete && hasAlloc) {
                        inp.classList.add('!bg-[#dcfce7]', 'text-green-800');
                    } else {
                        inp.classList.add('bg-transparent', 'text-slate-800', 'focus:bg-indigo-50');
                    }
                });
            });

            let vnsInputsByGroup = {};
            document.querySelectorAll('input.vns-group-input').forEach(inp => {
                let gId = inp.dataset.vnsgroupid;
                if (!vnsInputsByGroup[gId]) vnsInputsByGroup[gId] = [];
                vnsInputsByGroup[gId].push(inp);
            });

            let rIdx = window.currentRozkladIndex;

            for (let gId in vnsInputsByGroup) {
                let inputs = vnsInputsByGroup[gId];
                
                let rId = p.ekranData[gId]?.rozklads?.[rIdx]?.id;
                let maxHours = rId ? getMaxRozkladHour(gId, 'spec_STATIC_navch', rId) : 0;
                
                let usedHours = 0;
                inputs.forEach(inp => {
                    if (inp.value.trim()) usedHours++;
                });

                let isOver = (usedHours > maxHours);
                let isComplete = (usedHours === maxHours);
                let hasAlloc = (maxHours > 0);

                let rowHeader = inputs[0].closest('tr').querySelector('.op-tch');
                if (rowHeader) {
                    rowHeader.classList.remove('!bg-[#dcfce7]', 'text-green-800');
                    if (hasAlloc) {
                        if (isComplete) {
                            rowHeader.classList.add('!bg-[#dcfce7]', 'text-green-800');
                            rowHeader.title = "Виставлено всі години виробничого навчання";
                        } else {
                            let rem = maxHours - usedHours;
                            rowHeader.title = `Залишилось виставити: ${rem > 0 ? rem : 0} год.`;
                        }
                    } else {
                        rowHeader.title = "Години виробничого навчання не призначено";
                    }
                }

                inputs.forEach(inp => {
                    let val = inp.value.trim();
                    inp.classList.remove('!bg-pink-100', 'text-pink-800', '!bg-red-200', 'text-red-900', '!bg-[#dcfce7]', 'text-green-800', 'bg-transparent', 'text-slate-800');
                    inp.removeAttribute('title');

                    if (!val) {
                        inp.classList.add('bg-transparent', 'text-slate-800');
                        return;
                    }

                    let isConflict = conflictingCells.has(inp.dataset.key);

                    if (isConflict) {
                        inp.classList.add('!bg-red-200', 'text-red-900');
                        inp.title = "Конфлікт: група одночасно на виробничому і у викладача!";
                    } else if (isOver || !hasAlloc) {
                        inp.classList.add('!bg-pink-100', 'text-pink-800');
                        inp.title = hasAlloc ? `Перевищено ліміт (макс: ${maxHours} год, поставлено: ${usedHours})` : "Групі не призначено години в/н!";
                    } else if (isComplete && hasAlloc) {
                        inp.classList.add('!bg-[#dcfce7]', 'text-green-800');
                        inp.title = `Норма виконана (${maxHours} год)`;
                    } else {
                        inp.classList.add('bg-transparent', 'text-slate-800');
                        inp.title = `Поставлено ${usedHours} з ${maxHours} год.`;
                    }
                });
            }
        };

            if(!hasOpts) html += `<div class="px-3 py-2 text-slate-400 text-xs text-center italic">Всі предмети вичитано</div>`;

            document.getElementById('reg-subj-list').innerHTML = html;

            const rect = event.currentTarget.getBoundingClientRect();

        function getSubjName(id) {
            if (!id) return '';
            if (id.startsWith('gen_')) {
                let core = id.replace('gen_', '').replace('_split', '');
                let s = p.genSubjectsData.find(x => x.id === core);
                return s ? s.name + (id.includes('_split') ? ' (підгр.)' : '') : id;
            }
            if (id.startsWith('spec_')) {
                if (id.includes('STATIC_pract')) return 'Виробнича практика';
                if (id.includes('STATIC_navch')) return 'Виробниче навчання';
                let core = id.replace('spec_', '').replace('_main', '').replace('_split', '');
                let s = p.specSubjectsAll.find(x => x.id === core);
                return s ? s.name + (id.includes('_split') ? ' (підгр.)' : '') : id;
            }
            return id;
        }

        function getLastName(fullName) {
            if (!fullName) return '';
            return fullName.trim().split(' ')[0];
        }

        function buildRegGrid(rIdx) {
            const daysConfig = getDaysConfig();
            let grid = {}; 
            let usages = {}; 

            let operData = window.rozkladData[rIdx]?.oper || {};
            let regData = window.rozkladData[rIdx]?.reg || {};

            p.groupsData.forEach(g => {
                let gNum = (g.num || g.name).toString();
                let gName = g.name;
                grid[g.id] = {};
                usages[g.id] = {};

                let groupSubjects = getGroupSubjectsWithIds(g.id); 
                groupSubjects.forEach(s => {
                    s.reqHours = getMaxRozkladHour(g.id, s.id, p.ekranData[g.id]?.rozklads?.[rIdx]?.id);
                });

                daysConfig.forEach((d, dIdx) => {
                    grid[g.id][dIdx] = {};
                    for(let l = 1; l <= d.count; l++) {
                        let tId = null;
                        let tName = '';
                        let activeTeachers = [];

                        for (let t of p.teachersData) {
                            let val = operData[`${t.id}_${dIdx}_${l}`] || "";
                            let grps = val.split(/[\/\,]/).map(s=>s.trim()).filter(Boolean);
                            if (grps.includes(gNum) || grps.includes(gName)) {
                                activeTeachers.push(t);
                            }
                        }

                        let isVns = false;
                        let vnsVal = operData[`vnsgrp_${g.id}_${dIdx}_${l}`] || "";
                        let vnsGrps = vnsVal.split(/[\/\,]/).map(s=>s.trim()).filter(Boolean);

                        if (vnsGrps.includes(gNum) || vnsGrps.includes(gName)) {
                            isVns = true;
                            let master1Id = p.workloadMap[`spec_STATIC_navch_${g.id}`]?.teacherId;
                            let master2Id = p.workloadMap[`spec_STATIC_navch_${g.id}`]?.teacherId2;

                            let masterNames = [];
                            if(master1Id) masterNames.push(p.teachersData.find(t=>t.id===master1Id)?.name || '');
                            if(master2Id) masterNames.push(p.teachersData.find(t=>t.id===master2Id)?.name || '');

                            tId = master1Id || 'VNS'; 
                            tName = masterNames.length > 0 ? masterNames.map(n => getLastName(n)).join(' / ') : 'Майстер в/н'; 
                        } else if (activeTeachers.length > 0) {
                            tId = activeTeachers[0].id;
                            tName = activeTeachers.map(t => getLastName(t.name)).join(' / ');
                        }

                        let cell = { tId, tName, subjId: null, subjName: '', room: regData[`room_${g.id}_${dIdx}_${l}`] || '', availableSubjs: [], isAuto: false };

                        if (isVns) {
                            cell.subjId = 'spec_STATIC_navch';
                            cell.subjName = 'Виробниче навчання';
                            cell.isAuto = true;
                        } else if (tId) {
                            
                            let teacherSubjIds = activeTeachers.map(at => {
                                return groupSubjects.filter(s => s.teacherId === at.id || s.teacherId2 === at.id).map(s => s.id);
                            });
                            
                            let validSubjIds = [];
                            
                            if (activeTeachers.length > 1) {
                                let commonSubjIds = teacherSubjIds[0].filter(id => teacherSubjIds.every(ts => ts.includes(id)));
                                let singleSubjTeacher = teacherSubjIds.find(ts => ts.length === 1);
                                
                                if (singleSubjTeacher) {
                                    validSubjIds = singleSubjTeacher; 
                                } else if (commonSubjIds.length > 0) {
                                    validSubjIds = commonSubjIds; 
                                } else {
                                    validSubjIds = [...new Set(teacherSubjIds.flat())]; 
                                }
                            } else {
                                validSubjIds = [...new Set(teacherSubjIds.flat())];
                            }
                            
                            let uniqueSubjs = validSubjIds.map(id => groupSubjects.find(s => s.id === id)).filter(Boolean);
                            cell.availableSubjs = uniqueSubjs;

                            let savedSubjId = regData[`subj_${g.id}_${dIdx}_${l}`];

                            if (savedSubjId && uniqueSubjs.some(s => s.id === savedSubjId)) {
                                cell.subjId = savedSubjId;
                                cell.subjName = getSubjName(savedSubjId);
                            } else if (uniqueSubjs.length === 1) {
                                cell.subjId = uniqueSubjs[0].id;
                                cell.subjName = getSubjName(uniqueSubjs[0].id);
                                cell.isAuto = true;
                            }
                        }

                        if (cell.subjId) {
                            usages[g.id][cell.subjId] = (usages[g.id][cell.subjId] || 0) + 1;
                        }

                        grid[g.id][dIdx][l] = cell;
                    }
                });
            });

            return { grid, usages };
        }

            activeTeachers.forEach((t, i) => {
