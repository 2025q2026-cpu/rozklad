<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { background: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        .table-wrapper { border-top: 1px solid #94a3b8; border-left: 1px solid #94a3b8; }
        .excel-table { border-collapse: separate; border-spacing: 0; width: 100%; user-select: none; }
        .excel-table th, .excel-table td { border-bottom: 1px solid #94a3b8; border-right: 1px solid #94a3b8; padding: 2px; background-clip: padding-box; vertical-align: middle; }
        .excel-table th.fixed-col, .excel-table td.fixed-col { border-right: 2px solid #475569 !important; }
        
        .z-top-left { z-index: 60 !important; } .z-top { z-index: 50 !important; } .z-left { z-index: 40 !important; }      

        .print-header-view { display: none; }

        /* CSS ДЛЯ ДРУКУ */
        @media print {
            @page { size: landscape; margin: 5mm; }
            body { background: white; padding: 0 !important; margin: 0 !important; overflow: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-hide { display: none !important; }
            .print-header-view.show-print { display: block !important; }
            body, html { height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; }
            
            .hidden { display: none !important; }
            .view-tarif-container:not(.hidden), .table-wrapper { 
                height: auto !important; min-height: auto !important; max-height: none !important; overflow: visible !important; display: block !important;
            }
            
            .table-wrapper { border: none !important; }
            .excel-table { width: 100% !important; table-layout: fixed; }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; }
            
            .excel-table th, .excel-table td { border: 1px solid #000 !important; color: #000 !important; padding: 1px !important; font-size: 8px !important; white-space: normal !important; word-wrap: break-word; }
            .excel-table th.fixed-col, .excel-table td.fixed-col { border-right: 1px solid #000 !important; }
            
            .sticky { position: static !important; }
            
            /* Ширші колонки для Викладача (150px) та Назви предмета (200px) */
            .min-w-\[150px\] { min-width: 110px !important; width: 110px !important; max-width: 110px !important; }
            .min-w-\[200px\] { min-width: 140px !important; width: 140px !important; max-width: 140px !important; }
            .min-w-\[42px\], .w-\[42px\] { min-width: 22px !important; width: 22px !important; max-width: 22px !important; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-slate-700">

    <!-- ЗАГОЛОВОК ДЛЯ ДРУКУ (ТАРИФІКАЦІЯ) -->
    <div id="print-header-tarif" class="print-header-view mb-4 pt-4" style="font-family: 'Times New Roman', serif;">
        <table style="border:none; width:100%; margin-bottom:15px; font-size:11px; font-weight:bold;">
            <tr style="border:none;">
                <td style="border:none; text-align:left; vertical-align:top; width:50%;">
                    ПОГОДЖЕНО<br>
                    Голова профспілкового комітету<br>
                    <span class="print-inst-name-span"></span><br>
                    _________________ <span id="print-prof-name"></span>
                </td>
                <td style="border:none; text-align:center; vertical-align:top; width:50%;">
                    ЗАТВЕРДЖУЮ<br>
                    Директор <span class="print-inst-name-span"></span><br>
                    _______________ <span id="print-dir-name"></span><br>
                    "____" _____________ 202__ р.
                </td>
            </tr>
        </table>
        <h1 class="text-base font-bold text-black text-center mb-2">
            Розподіл годин між викладачами (<span id="print-tarif-type-label"></span>)<br>
            на <span id="print-year-label-tarif"></span> н.р.
        </h1>
    </div>

    <!-- ПІДМЕНЮ З КНОПКАМИ -->
    <div id="submenu-tarif" class="px-4 flex justify-between items-center text-sm font-medium text-slate-500 shrink-0 border-b border-slate-200 pb-2 print-hide bg-white/50 pt-2 rounded-t-xl">
        <div class="flex gap-4 items-center">
            <button class="tarif-sub-tab active text-indigo-600 border-b-2 border-indigo-600 pb-1" data-target="view-tarif-gen" data-printname="загальноосвітня підготовка">Загальноосвітня</button>
            <button class="tarif-sub-tab hover:text-slate-800 pb-1 transition-colors" data-target="view-tarif-spec" data-printname="спецпідготовка">Спецпідготовка</button>
            <button class="tarif-sub-tab hover:text-slate-800 pb-1 transition-colors" data-target="view-tarif-all" data-printname="спільний">Спільна</button>
        </div>
        <div class="flex gap-2 items-center">
            <div class="relative">
                <i class="fa-solid fa-search absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                <input type="text" id="tarif-search" placeholder="Пошук викладача..." class="pl-7 pr-2 py-1.5 border border-slate-300 rounded-lg text-xs outline-none focus:border-indigo-500 w-48 shadow-sm">
            </div>
            <button onclick="window.renderTariffication()" class="px-2 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg border border-indigo-200 text-xs shadow-sm ml-1" title="Оновити таблиці"><i class="fa-solid fa-rotate-right"></i></button>
            <div class="w-px h-6 bg-slate-300 mx-1"></div>
            <button onclick="exportToExcelJS('tarif')" class="px-3 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg shadow-sm transition-colors border border-green-200"><i class="fa-solid fa-file-excel mr-1"></i> Excel</button>
            <button onclick="exportToWord('tarif')" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg shadow-sm transition-colors border border-blue-200"><i class="fa-solid fa-file-word mr-1"></i> Word</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg shadow-sm transition-colors border border-slate-300"><i class="fa-solid fa-print mr-1"></i> Друк</button>
        </div>
    </div>

    <!-- КОНТЕЙНЕРИ ТАРИФІКАЦІЇ -->
    <div id="mode-tarif" class="flex-1 flex flex-col overflow-hidden h-full pt-2">
        <div id="view-tarif-gen" class="flex-1 flex flex-col overflow-hidden h-full view-tarif-container">
            <div class="overflow-auto flex-1 bg-white relative table-wrapper rounded-lg" id="table-scroll-tarif-gen">
                <table id="table-tarif-gen-export" class="w-full text-left text-sm whitespace-nowrap excel-table relative">
                    <thead id="tarif-gen-thead"><tr><th class="p-3 bg-slate-200 sticky top-0 left-0">Завантаження...</th></tr></thead>
                    <tbody id="tarif-gen-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="view-tarif-spec" class="flex-1 flex flex-col overflow-hidden h-full hidden view-tarif-container">
            <div class="overflow-auto flex-1 bg-white relative table-wrapper rounded-lg" id="table-scroll-tarif-spec">
                <table id="table-tarif-spec-export" class="w-full text-left text-sm whitespace-nowrap excel-table relative">
                    <thead id="tarif-spec-thead"><tr><th class="p-3 bg-slate-200 sticky top-0 left-0">Завантаження...</th></tr></thead>
                    <tbody id="tarif-spec-tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="view-tarif-all" class="flex-1 flex flex-col overflow-hidden h-full hidden view-tarif-container">
            <div class="overflow-auto flex-1 bg-white relative table-wrapper rounded-lg" id="table-scroll-tarif-all">
                <table id="table-tarif-all-export" class="w-full text-left text-sm whitespace-nowrap excel-table relative">
                    <thead id="tarif-all-thead"><tr><th class="p-3 bg-slate-200 sticky top-0 left-0">Завантаження...</th></tr></thead>
                    <tbody id="tarif-all-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        const p = window.parent; // Доступ до глобальних даних index.html

        // Перемикання вкладок
        document.querySelectorAll('.tarif-sub-tab').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tarif-sub-tab').forEach(b => { 
                    b.classList.remove('active', 'text-indigo-600', 'border-b-2', 'border-indigo-600'); 
                    b.classList.add('text-slate-500'); 
                });
                e.target.classList.add('active', 'text-indigo-600', 'border-b-2', 'border-indigo-600'); 
                e.target.classList.remove('text-slate-500');
                
                document.querySelectorAll('.view-tarif-container').forEach(c => c.classList.add('hidden'));
                document.getElementById(e.target.dataset.target).classList.remove('hidden');
                window.applyTarifSearch(); 
            });
        });

        // Допоміжна функція форматування ПІБ для друку
        function formatNameForHeader(fullName) {
            if (!fullName) return "";
            const parts = fullName.trim().split(/\s+/);
            if (parts.length >= 2) {
                const surname = parts[0].toUpperCase();
                const name = parts[1];
                return `${name} ${surname}`;
            }
            return fullName.toUpperCase();
        }

        function getActiveTarifTitle() {
            const activeTab = document.querySelector('.tarif-sub-tab.active');
            if (!activeTab) return "спільна";
            return activeTab.dataset.printname || "спільна";
        }

        // Логіка друку
        window.addEventListener('beforeprint', () => {
            document.getElementById('print-year-label-tarif').innerText = p.CURRENT_YEAR;
            document.getElementById('print-dir-name').innerText = formatNameForHeader(p.generalSettings.dirFull);
            document.getElementById('print-prof-name').innerText = formatNameForHeader(p.generalSettings.profFull);
            document.querySelectorAll('.print-inst-name-span').forEach(el => el.innerText = p.INSTITUTION_NAME);
            document.getElementById('print-tarif-type-label').innerText = getActiveTarifTitle();
            document.getElementById('print-header-tarif').classList.add('show-print');
        });

        window.addEventListener('afterprint', () => {
            document.getElementById('print-header-tarif').classList.remove('show-print');
        });

        // Оновлення таблиць з батьківського вікна
        window.onDataUpdated = function() {
            window.renderTariffication();
        };

        // ГОЛОВНИЙ РЕНДЕР
        window.renderTariffication = function() {
            renderTarifficationTab('gen', 'tarif-gen-thead', 'tarif-gen-tbody');
            renderTarifficationTab('spec', 'tarif-spec-thead', 'tarif-spec-tbody');
            renderTarifficationTab('all', 'tarif-all-thead', 'tarif-all-tbody');
            window.applyTarifSearch(); 
        };

        function renderTarifficationTab(type, theadId, tbodyId) {
            const thead = document.getElementById(theadId);
            const tbody = document.getElementById(tbodyId);

            if (!p.teachersData || p.teachersData.length === 0 || !p.groupsData || p.groupsData.length === 0) {
                thead.innerHTML = `<tr><th class="p-3 bg-slate-100 text-slate-500 font-bold">Інформація</th></tr>`;
                tbody.innerHTML = `<tr><td class="p-8 text-center text-slate-500 bg-white"><i class="fa-solid fa-users text-4xl mb-3 text-slate-300"></i><br>Відсутні дані для побудови.</td></tr>`;
                return;
            }

            let validGroups = p.groupsData;
            if (type === 'gen') {
                validGroups = p.groupsData.filter(g => g.education.includes('Базова'));
            }

            const courses = [1, 2, 3, 4]; 
            let courseGroups = {}; let hasCourse = {};
            let totalGroups = 0;
            courses.forEach(c => { 
                courseGroups[c] = validGroups.filter(g => parseInt(g.course) === c); 
                hasCourse[c] = courseGroups[c].length > 0; 
                totalGroups += courseGroups[c].length;
            });

            let groupColIndices = [];
            for(let i = 0; i < totalGroups; i++) groupColIndices.push(4 + i);
            let sumColsStr = groupColIndices.join(',');

            let courseRow = `<tr><th class="h-[32px] bg-slate-200 sticky left-0 top-0 z-top-left fixed-col w-12 text-center" rowspan="2">№ п/п</th><th class="h-[32px] bg-slate-200 sticky left-[48px] top-0 z-top-left fixed-col min-w-[150px] text-center" rowspan="2">Викладач</th><th class="h-[32px] bg-slate-200 sticky left-[198px] top-0 z-top-left fixed-col min-w-[200px] text-center" rowspan="2">Назва предмета</th>`;
            courses.forEach(c => { 
                if(hasCourse[c]) { courseRow += `<th colspan="${courseGroups[c].length}" class="h-[32px] bg-slate-200 text-center text-xs uppercase sticky top-0 z-top">${['І','ІІ','ІІІ','IV'][c-1]} курс</th>`; } 
            });
            courseRow += `<th class="h-[32px] bg-yellow-300 text-center text-xs uppercase w-12 font-bold sticky top-0 z-top" rowspan="2" style="writing-mode: vertical-rl; transform: rotate(180deg);">Разом</th><th class="h-[32px] bg-yellow-400 text-center text-xs uppercase w-12 font-bold sticky top-0 z-top" rowspan="2" style="writing-mode: vertical-rl; transform: rotate(180deg);">Всього<br>годин</th></tr><tr>`;

            courses.forEach(c => { 
                if(hasCourse[c]) { courseGroups[c].forEach(g => { courseRow += `<th class="h-[40px] bg-slate-100 text-center font-bold text-indigo-700 text-xs min-w-[42px] w-[42px] px-1 sticky top-[32px] z-top shadow-sm">${g.num ? g.num : g.name}</th>`; }); } 
            });
            courseRow += `</tr>`;
            thead.innerHTML = courseRow;

            let teacherWorkload = {};
            p.teachersData.forEach(t => teacherWorkload[t.id] = { teacher: t, subjects: {}, total: 0 });

            const addHoursToTeacher = (tId, subjName, groupId, hours) => {
                if (!tId || !teacherWorkload[tId]) return;
                const h = parseFloat(hours) || 0;
                if (h <= 0) return;
                
                if (!teacherWorkload[tId].subjects[subjName]) { teacherWorkload[tId].subjects[subjName] = { rowTotal: 0, groups: {} }; }
                if (!teacherWorkload[tId].subjects[subjName].groups[groupId]) { teacherWorkload[tId].subjects[subjName].groups[groupId] = 0; }
                teacherWorkload[tId].subjects[subjName].groups[groupId] += h;
                teacherWorkload[tId].subjects[subjName].rowTotal += h;
                teacherWorkload[tId].total += h;
            };

            for (let key in p.workloadMap) {
                let cellData = p.workloadMap[key];
                let hours = parseFloat(cellData.hours) || 0;
                if (hours <= 0) continue;

                if (type === 'gen' && !key.startsWith('gen_')) continue;
                if (type === 'spec' && !key.startsWith('spec_')) continue;

                let subjName = "Невідомо";
                let groupId = null;
                let parts = key.split('_');

                if (key.startsWith('gen_')) {
                    groupId = parts[parts.length - 1];
                    let sId = parts.slice(1, parts.length - 1).join('_');
                    if (sId.includes('_split')) {
                        let realId = sId.replace('_split', ''); let subj = p.genSubjectsData.find(s => s.id === realId);
                        subjName = subj ? subj.name + " (поділ)" : "Заг. предм. (поділ)";
                    } else if (sId.startsWith('STATIC_')) {
                        if (sId === 'STATIC_consult') subjName = "Консультації"; if (sId === 'STATIC_exams') subjName = "Екзамени";
                    } else {
                        let subj = p.genSubjectsData.find(s => s.id === sId); subjName = subj ? subj.name : "Заг. предмет";
                    }
                } else if (key.startsWith('spec_')) {
                    groupId = parts[parts.length - 1];
                    let stype = parts[parts.length - 2]; 
                    
                    if (parts[1] === 'STATIC') {
                        let sId = parts.slice(1, parts.length - 1).join('_');
                        if (sId === 'STATIC_navch_spec' || sId === 'STATIC_navch_zo' || sId === 'STATIC_pract' || sId === 'STATIC_navch' || sId === 'STATIC_cons' || sId === 'STATIC_dpa') continue;
                        if (sId.startsWith('STATIC_dka')) subjName = "ДКА";
                    } else {
                        let sId = parts.slice(1, parts.length - 2).join('_');
                        let subj = p.specSubjectsAll.find(s => s.id === sId); subjName = subj ? subj.name : "Спец. предмет";
                        if (stype === 'split') subjName += " (поділ)";
                    }
                }

                if (validGroups.find(g => g.id === groupId)) {
                    if (cellData.teacherId) addHoursToTeacher(cellData.teacherId, subjName, groupId, hours);
                    if (cellData.teacherId2) addHoursToTeacher(cellData.teacherId2, subjName, groupId, hours);
                }
            }

            let html = '';
            let tIndex = 1;
            let activeTeachers = Object.values(teacherWorkload).filter(tw => tw.total > 0).sort((a,b) => a.teacher.name.localeCompare(b.teacher.name, 'uk'));

            activeTeachers.forEach(tw => {
                let subjNames = Object.keys(tw.subjects).sort((a,b) => a.localeCompare(b, 'uk'));
                let rowsSpan = subjNames.length;
                
                subjNames.forEach((sName, sIdx) => {
                    let isLast = (sIdx === rowsSpan - 1);
                    let bStyle = isLast ? 'border-bottom: 2px solid #475569;' : '';
                    let rStyle = 'border-bottom: 2px solid #475569;'; 
                    
                    html += `<tr class="bg-white hover:bg-indigo-50/30 transition-colors duration-150" data-teacher="${tw.teacher.name.toLowerCase()}">`;
                    
                    if (sIdx === 0) {
                        html += `<td rowspan="${rowsSpan}" class="p-2 border-b border-r border-slate-300 text-center sticky left-0 bg-white z-left fixed-col font-bold text-slate-500 align-middle" style="${rStyle}">${tIndex++}</td>`;
                        html += `<td rowspan="${rowsSpan}" class="p-2 border-b border-r border-slate-300 font-bold text-sm text-slate-800 sticky left-[48px] bg-white z-left fixed-col min-w-[150px] align-middle" style="${rStyle}"><div class="truncate">${tw.teacher.name}</div></td>`;
                    }
                    
                    html += `<td class="p-2 border-b border-r border-slate-300 text-sm text-slate-700 sticky left-[198px] bg-white z-left fixed-col min-w-[200px]" style="${bStyle}"><div class="truncate" title="${sName}">${sName}</div></td>`;
                    
                    let subjectTotal = 0;
                    courses.forEach(c => {
                        if (hasCourse[c]) {
                            courseGroups[c].forEach(g => {
                                let h = tw.subjects[sName].groups[g.id] || 0;
                                subjectTotal += h;
                                html += `<td class="p-2 text-center align-middle border-b border-r border-slate-300 ${h > 0 ? 'font-bold text-slate-900 bg-indigo-50/50' : 'text-slate-300'}" style="${bStyle}">${h > 0 ? h : ''}</td>`;
                            });
                        }
                    });
                    
                    html += `<td data-sum-cols="${sumColsStr}" class="p-2 text-center font-bold text-indigo-700 bg-yellow-100 border-b border-r border-slate-300" style="${bStyle}">${subjectTotal > 0 ? subjectTotal : ''}</td>`;
                    
                    if (sIdx === 0) {
                        html += `<td data-teacher-total="${rowsSpan}" rowspan="${rowsSpan}" class="p-2 text-center font-black text-lg text-slate-800 bg-yellow-300 align-middle border-b border-r border-slate-300" style="${rStyle}">${tw.total}</td>`;
                    }
                    
                    html += `</tr>`;
                });
            });

            if (activeTeachers.length === 0) {
                html = `<tr><td colspan="100%" class="p-8 text-center text-slate-500 bg-white">Годин ще не розподілено.</td></tr>`;
            }

            tbody.innerHTML = html;
        }

        window.applyTarifSearch = function() {
            const searchInput = document.getElementById('tarif-search');
            if (!searchInput) return;
            const term = searchInput.value.toLowerCase().trim();
            
            const activeContainer = document.querySelector('.view-tarif-container:not(.hidden)');
            if (activeContainer) {
                const rows = activeContainer.querySelectorAll('tbody tr[data-teacher]');
                rows.forEach(tr => {
                    const teacherName = tr.getAttribute('data-teacher');
                    if (teacherName && teacherName.includes(term)) {
                        tr.style.display = '';
                    } else if (teacherName) {
                        tr.style.display = 'none';
                    }
                });
            }
        };
        document.getElementById('tarif-search').addEventListener('input', window.applyTarifSearch);

        // ЛОГІКА ЕКСПОРТУ В EXCEL ТА WORD
        function getColLetter(num) {
            let letter = ''; while (num > 0) { let mod = (num - 1) % 26; letter = String.fromCharCode(65 + mod) + letter; num = Math.floor((num - mod) / 26); }
            return letter;
        }

        window.exportToExcelJS = async function(mode) {
            const wb = new ExcelJS.Workbook();
            
            function processTableToSheet(tableElement, sheetName, tarifTitle = "") {
                const ws = wb.addWorksheet(sheetName);
                
                const tableClone = tableElement.cloneNode(true);
                tableClone.querySelectorAll('.print-hide').forEach(e => e.remove());
                const rows = tableClone.querySelectorAll('tr');
                
                let offsetR = 7;
                let totalCols = 0;
                if(rows.length > 0) { rows[0].querySelectorAll('th, td').forEach(c => totalCols += parseInt(c.getAttribute('colspan')) || 1); }
                
                let profLines = ["ПОГОДЖЕНО", "Голова профспілкового комітету", p.INSTITUTION_NAME, `_________________ ${formatNameForHeader(p.generalSettings.profFull)}`];
                profLines.forEach((line, i) => {
                    ws.mergeCells(i + 1, 1, i + 1, 4);
                    let cell = ws.getCell(i + 1, 1);
                    cell.value = line; cell.alignment = { vertical: 'middle', horizontal: 'left' };
                    cell.font = { name: 'Times New Roman', size: 11, bold: true };
                });
                
                let dirLines = ["ЗАТВЕРДЖУЮ", `Директор ${p.INSTITUTION_NAME}`, `_______________ ${formatNameForHeader(p.generalSettings.dirFull)}`, `"____" _____________ 202_ р.`];
                let rightStart = Math.max(5, totalCols - 7); 
                dirLines.forEach((line, i) => {
                    ws.mergeCells(i + 1, rightStart, i + 1, totalCols);
                    let cell = ws.getCell(i + 1, rightStart);
                    cell.value = line; cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    cell.font = { name: 'Times New Roman', size: 11, bold: true };
                });
                
                ws.mergeCells(6, 1, 6, totalCols); ws.mergeCells(7, 1, 7, totalCols);
                const title = ws.getCell(7, 1);
                title.value = `Розподіл годин між викладачами (${tarifTitle}) на ${p.CURRENT_YEAR} н.р.`;
                title.alignment = { vertical: 'middle', horizontal: 'center' }; 
                title.font = { name: 'Times New Roman', size: 12, bold: true };

                let matrix = [];
                let visibleRows = Array.from(rows).filter(r => r.style.display !== 'none');
                
                visibleRows.forEach((tr, rIdx) => {
                    let cIdx = 0;
                    const cells = tr.querySelectorAll('th, td');
                    
                    cells.forEach(cell => {
                        while(matrix[rIdx] && matrix[rIdx][cIdx]) { cIdx++; }
                        let rSpan = parseInt(cell.getAttribute('rowspan')) || 1; let cSpan = parseInt(cell.getAttribute('colspan')) || 1;
                        for(let r = 0; r < rSpan; r++) { for(let c = 0; c < cSpan; c++) { if(!matrix[rIdx + r]) matrix[rIdx + r] = []; matrix[rIdx + r][cIdx + c] = true; } }
                        
                        const targetRow = offsetR + rIdx + 1; const targetCol = cIdx + 1;
                        const excelCell = ws.getCell(targetRow, targetCol);
                        if (rSpan > 1 || cSpan > 1) ws.mergeCells(targetRow, targetCol, targetRow + rSpan - 1, targetCol + cSpan - 1);
                        
                        let val = cell.innerText.trim();
                        let sumCols = cell.getAttribute('data-sum-cols'); let teacherTotal = cell.getAttribute('data-teacher-total');
                        
                        if (sumCols) {
                            excelCell.value = { formula: '=' + sumCols.split(',').map(c => getColLetter(parseInt(c)) + targetRow).join('+'), result: parseFloat(val) || 0 };
                        } else if (teacherTotal) {
                            let span = parseInt(teacherTotal); let sumColLetter = getColLetter(targetCol - 1); 
                            excelCell.value = { formula: `=SUM(${sumColLetter}${targetRow}:${sumColLetter}${targetRow + span - 1})`, result: parseFloat(val) || 0 };
                        } else if (val === '') excelCell.value = null; else if (!isNaN(val)) excelCell.value = parseFloat(val); else excelCell.value = val;
                        
                        let argb = 'FFFFFFFF'; const classStr = (cell.className + ' ' + tr.className);
                        if(classStr.includes('bg-slate-200')) argb = 'FFE2E8F0';
                        else if(classStr.includes('bg-slate-300')) argb = 'FFCBD5E1';
                        else if(classStr.includes('bg-yellow-300')) argb = 'FFFDE047';
                        else if(classStr.includes('bg-yellow-400')) argb = 'FFFACC15';
                        else if(classStr.includes('bg-yellow-100')) argb = 'FFFEF9C3';
                        else if(classStr.includes('bg-slate-100')) argb = 'FFF1F5F9';
                        else if(classStr.includes('bg-indigo-50/50') || classStr.includes('bg-indigo-50')) argb = 'FFEEF2FF';
                        
                        if(argb !== 'FFFFFFFF') excelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } };
                        excelCell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        
                        let isBold = cell.tagName === 'TH' || classStr.includes('font-bold'); let isItalic = classStr.includes('italic'); let fontColor = 'FF000000';
                        if(classStr.includes('text-indigo-700') || classStr.includes('text-indigo-900')) fontColor = 'FF312E81';
                        
                        excelCell.font = { bold: isBold, italic: isItalic, color: { argb: fontColor }, size: 9, name: 'Arial' };
                        let align = { vertical: 'middle', horizontal: 'center', wrapText: true };
                        if(classStr.includes('text-left')) align.horizontal = 'left';
                        if(classStr.includes('text-right')) align.horizontal = 'right';
                        if(cell.style.writingMode === 'vertical-rl') align.textRotation = 90;
                        excelCell.alignment = align;
                    });
                });
                
                ws.columns.forEach((col, i) => { if(i===0) col.width=4; else if(i===1) col.width=25; else if(i===2) col.width=25; else col.width=5; });
            }
            
            processTableToSheet(document.getElementById('table-tarif-gen-export'), 'Загальноосвітня', 'загальноосвітня підготовка');
            processTableToSheet(document.getElementById('table-tarif-spec-export'), 'Спецпідготовка', 'спецпідготовка');
            processTableToSheet(document.getElementById('table-tarif-all-export'), 'Спільна', 'спільний');
            const buffer = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Тарифікація_${p.CURRENT_YEAR}.xlsx`);
        };

        window.exportToWord = function(mode) {
            let style = `<style>
                @page WordSection1 { size: 29.7cm 21.0cm; mso-page-orientation: landscape; margin: 1cm; } div.WordSection1 { page: WordSection1; }
                body { font-family: 'Times New Roman', serif; } p, table, td, th, tr { margin: 0; padding: 0; }
                table { border-collapse: collapse; width: 100%; font-size: 10px; margin-bottom: 20px; }
                th, td { border: 1px solid #000; padding: 2px; text-align: center; vertical-align: middle; }
                .page-break { page-break-before: always; } .hidden-row { display: none !important; }
            </style>`;
            
            function cleanTableForWord(tableElement) {
                const clone = document.getElementById(tableElement).cloneNode(true);
                clone.querySelectorAll('.print-hide').forEach(e => e.remove());
                
                clone.querySelectorAll('tr').forEach(tr => { if (tr.style.display === 'none') tr.classList.add('hidden-row'); tr.removeAttribute('style'); });
                clone.querySelectorAll('th, td').forEach(cell => {
                    let val = cell.innerText.trim();
                    let bgColor = ''; const cls = cell.className || '';
                    if(cls.includes('bg-slate-200')) bgColor = '#e2e8f0';
                    else if(cls.includes('bg-slate-300')) bgColor = '#cbd5e1';
                    else if(cls.includes('bg-yellow-300') || cls.includes('bg-yellow-100')) bgColor = '#fef08a';
                    else if(cls.includes('bg-yellow-400')) bgColor = '#facc15';
                    else if(cls.includes('bg-slate-100')) bgColor = '#f1f5f9';
                    else if(cls.includes('bg-[#f8fafc]') || cls.includes('bg-indigo-50/50') || cls.includes('bg-indigo-50')) bgColor = '#f8fafc';
                    
                    cell.innerHTML = val; cell.removeAttribute('class'); cell.removeAttribute('style');
                    let styleStr = 'margin: 0; padding: 2px;'; if (bgColor) styleStr += ` background-color: ${bgColor};`;
                    if (cell.style.writingMode === 'vertical-rl') styleStr += ` width: 30px; word-break: break-all; text-align: center; mso-layout-flow: vertical-ideographic; writing-mode: tb-rl;`;
                    if (cls.includes('font-bold') || cell.tagName === 'TH') styleStr += ` font-weight: bold;`;
                    if (cls.includes('text-left')) styleStr += ` text-align: left;`;
                    cell.setAttribute('style', styleStr);
                });
                return clone.outerHTML;
            }
            
            let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8">${style}</head><body><div class="WordSection1">`;
            
            let tarifHeader = (title) => `
                <table style="border:none; width:100%; margin-bottom:20px; font-size:12px; font-weight:bold;">
                    <tr style="border:none;">
                        <td style="border:none; text-align:left; vertical-align:top; width:50%;">
                            ПОГОДЖЕНО<br>Голова профспілкового комітету<br>${p.INSTITUTION_NAME}<br>_________________ ${formatNameForHeader(p.generalSettings.profFull)}
                        </td>
                        <td style="border:none; text-align:center; vertical-align:top; width:50%;">
                            ЗАТВЕРДЖУЮ<br>Директор ${p.INSTITUTION_NAME}<br>_______________ ${formatNameForHeader(p.generalSettings.dirFull)}<br>"____" _____________ 202_ р.
                        </td>
                    </tr>
                </table>
                <h2 style="text-align:center; font-size: 16px; margin-bottom: 10px;">Розподіл годин між викладачами (${title}) на ${p.CURRENT_YEAR} н.р.</h2>
            `;
            
            html += tarifHeader("загальноосвітня підготовка") + cleanTableForWord('table-tarif-gen-export');
            html += `<div class="page-break"></div>`;
            html += tarifHeader("спецпідготовка") + cleanTableForWord('table-tarif-spec-export');
            html += `<div class="page-break"></div>`;
            html += tarifHeader("спільний") + cleanTableForWord('table-tarif-all-export');
            
            html += `</div></body></html>`;
            saveAs(new Blob([html], { type: 'application/msword' }), `Тарифікація_${p.CURRENT_YEAR}.doc`);
        };

        // Запуск при ініціалізації
        if(p.groupsData && p.groupsData.length > 0) window.onDataUpdated();

    </script>
</body>
