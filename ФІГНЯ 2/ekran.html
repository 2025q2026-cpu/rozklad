<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { background: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        .table-wrapper { border-top: 1px solid #94a3b8; border-left: 1px solid #94a3b8; }
        .excel-table { border-collapse: separate; border-spacing: 0; width: 100%; user-select: none; }
        .excel-table th, .excel-table td { border-bottom: 1px solid #94a3b8; border-right: 1px solid #94a3b8; padding: 2px; background-clip: padding-box; vertical-align: middle; }
        
        .z-top-left { z-index: 60 !important; } .z-top { z-index: 50 !important; } .z-left { z-index: 40 !important; }      

        /* Підсвітка активного рядка в Екрані */
        .ekran-data-row:hover td, .ekran-data-row:focus-within td {
            background-color: #eef2ff !important;
        }

        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .print-header-view { display: none; }

        /* CSS ДЛЯ ДРУКУ */
        @media print {
            @page { size: landscape; margin: 5mm; }
            body { background: white; padding: 0 !important; margin: 0 !important; overflow: visible !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-hide { display: none !important; }
            .print-header-view.show-print { display: block !important; }
            body, html { height: auto !important; max-height: none !important; overflow: visible !important; display: block !important; }
            
            #mode-ekran, #ekran-table-container, .table-wrapper { 
                height: auto !important; min-height: auto !important; max-height: none !important; overflow: visible !important; display: block !important;
            }
            
            .table-wrapper { border: none !important; }
            .excel-table { width: 100% !important; table-layout: fixed; }
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; }
            
            .excel-table th, .excel-table td { border: 1px solid #000 !important; color: #000 !important; padding: 1px !important; font-size: 8px !important; white-space: normal !important; word-wrap: break-word; }
            .sticky { position: static !important; }
            
            input[type="number"], input[type="text"] { border: none; background: transparent; -webkit-appearance: none; pointer-events: none; color: #000; font-size: 9px !important; padding: 0 !important; width: 100%; text-align: center; }
            .min-w-\[200px\] { min-width: 140px !important; width: 140px !important; max-width: 140px !important; }
            .min-w-\[150px\] { min-width: 100px !important; width: 100px !important; max-width: 100px !important; }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans text-slate-700">

    <!-- ЗАГОЛОВОК ДЛЯ ДРУКУ (ЕКРАН) -->
    <div id="print-header-ekran" class="print-header-view mb-4 text-center pt-4" style="font-family: 'Times New Roman', serif;">
        <h1 class="text-base font-bold text-black uppercase mb-1">Е К Р А Н</h1>
        <p class="text-sm text-black mb-1">виконання навчального плану і програми теоретичного і виробничого навчання</p>
        <p class="text-sm text-black font-bold">за <span id="print-ekran-year"></span> навчальний рік в групі № <span id="print-ekran-num"></span> <span class="print-inst-name-span"></span>, спеціальність <span id="print-ekran-spec"></span></p>
    </div>

    <!-- ПІДМЕНЮ З КНОПКАМИ (ЕКРАН) -->
    <div id="submenu-ekran" class="px-4 flex justify-between items-center text-sm font-medium text-slate-500 shrink-0 border-b border-slate-200 pb-2 print-hide bg-white/50 pt-2 rounded-t-xl">
        <div id="ekran-group-tabs" class="flex gap-2 overflow-x-auto w-2/3 items-center pb-1 custom-scrollbar">
            <!-- Вкладки груп додаватимуться динамічно -->
        </div>
        <div class="flex gap-2 shrink-0">
            <button onclick="exportToExcelJS('ekran')" class="px-3 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg shadow-sm transition-colors border border-green-200"><i class="fa-solid fa-file-excel mr-1"></i> Завантажити усі</button>
            <button onclick="exportToWord('ekran')" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg shadow-sm transition-colors border border-blue-200"><i class="fa-solid fa-file-word mr-1"></i> Завантажити усі</button>
            <button onclick="window.print()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg shadow-sm transition-colors border border-slate-300" title="Друк тільки обраної"><i class="fa-solid fa-print mr-1"></i> Друк</button>
        </div>
    </div>

    <!-- КОНТЕЙНЕР ЕКРАН -->
    <div id="mode-ekran" class="flex-1 flex flex-col overflow-hidden h-full pt-2">
        <div id="ekran-table-container" class="overflow-auto flex-1 bg-white relative table-wrapper rounded-lg">
            <!-- Таблиця екрану генерується динамічно -->
        </div>
    </div>

    <script type="module">
        const p = window.parent; // Доступ до глобальних даних index.html
        window.currentEkranGroupId = null;

        // Логіка друку
        window.addEventListener('beforeprint', () => {
            let g = p.groupsData.find(x => x.id === window.currentEkranGroupId);
            if (g) {
                document.getElementById('print-ekran-year').innerText = p.CURRENT_YEAR;
                document.getElementById('print-ekran-num').innerText = g.num || '';
                document.getElementById('print-ekran-spec').innerText = g.name || '';
            }
            document.querySelectorAll('.print-inst-name-span').forEach(el => el.innerText = p.INSTITUTION_NAME);
            document.getElementById('print-header-ekran').classList.add('show-print');
        });

        window.addEventListener('afterprint', () => {
            document.getElementById('print-header-ekran').classList.remove('show-print');
        });

        // Оновлення з батьківського вікна
        window.onDataUpdated = function() {
            // Перевіряємо, чи користувач зараз знаходиться в полі вводу
            const activeEl = document.activeElement;
            const isTyping = activeEl && activeEl.tagName === 'INPUT';

            if (isTyping) {
                // Оновлюємо лише підсумки та кольори
                if (window.currentEkranGroupId) {
                    window.updateEkranCalculations(window.currentEkranGroupId);
                }
            } else {
                // Повне перемальовування
                window.renderEkranGroups();
                if (window.currentEkranGroupId) {
                    window.updateEkranCalculations(window.currentEkranGroupId);
                }
            }
        };

        // Отримання ключів ДКА
        window.getDkaRowKeys = function() {
            let keys = new Set(['STATIC_dka']);
            for (let k in p.workloadMap) {
                if (k.startsWith('spec_STATIC_dka_')) {
                    let parts = k.split('_');
                    if (parts.length >= 5) {
                        keys.add(`STATIC_dka_${parts[3]}`);
                    }
                }
            }
            return Array.from(keys).sort();
        };

        // --- ЛОГІКА РЕНДЕРУ ---
        window.renderEkranGroups = function() {
            let tabsHtml = '';
            if (!p.groupsData) return;
            
            p.groupsData.forEach((g, i) => {
                tabsHtml += `<button class="ekran-sub-tab px-3 py-1.5 rounded-lg text-sm font-medium transition-colors text-slate-500 hover:bg-slate-100" data-groupid="${g.id}" onclick="window.selectEkranGroup('${g.id}', this)">${g.num || g.name}</button>`;
            });
            document.getElementById('ekran-group-tabs').innerHTML = tabsHtml;
            
            const savedGroupId = localStorage.getItem('fignia_active_group');
            if (savedGroupId && p.groupsData.some(g => g.id === savedGroupId)) {
                window.selectEkranGroup(savedGroupId, document.querySelector(`.ekran-sub-tab[data-groupid="${savedGroupId}"]`));
            } else if(p.groupsData.length > 0) {
                window.selectEkranGroup(p.groupsData[0].id, document.querySelector('.ekran-sub-tab'));
            } else {
                document.getElementById('ekran-table-container').innerHTML = '<div class="p-8 text-center text-slate-500">Немає груп. Перейдіть в Налаштування.</div>';
            }
        };

        window.selectEkranGroup = function(groupId, btn) {
            window.currentEkranGroupId = groupId;
            localStorage.setItem('fignia_active_group', groupId); 
            document.querySelectorAll('.ekran-sub-tab').forEach(b => {
                b.classList.remove('bg-indigo-100', 'text-indigo-700', 'font-bold', 'shadow-sm');
                b.classList.add('text-slate-500');
            });
            if(btn) {
                btn.classList.remove('text-slate-500');
                btn.classList.add('bg-indigo-100', 'text-indigo-700', 'font-bold', 'shadow-sm');
            }
            window.renderEkranTable(groupId);
        };
        
        window.getEkranTableHTML = function(groupId) {
            const group = p.groupsData.find(g => g.id === groupId);
            if (!group) return '';

            let groupSubjects = [];
            
            if (group.education.includes('Базова')) {
                p.genSubjectsData.forEach(subj => {
                    let mainH = parseFloat(p.workloadMap[`gen_${subj.id}_${groupId}`]?.hours || 0) || 0;
                    let splitH = parseFloat(p.workloadMap[`gen_${subj.id}_split_${groupId}`]?.hours || 0) || 0;
                    if (mainH > 0 || splitH > 0) {
                        let tMain = p.workloadMap[`gen_${subj.id}_${groupId}`]?.teacherId;
                        let tSplit = subj.isSplit ? p.workloadMap[`gen_${subj.id}_split_${groupId}`]?.teacherId : null;
                        let tNames = new Set();
                        if (tMain) tNames.add(p.teachersData.find(t=>t.id===tMain)?.name || '');
                        if (tSplit) tNames.add(p.teachersData.find(t=>t.id===tSplit)?.name || '');
                        
                        groupSubjects.push({ id: `gen_${subj.id}`, name: subj.name, teacher: Array.from(tNames).filter(Boolean).join(' / '), totalHours: mainH });
                    }
                });
                
                ['STATIC_consult', 'STATIC_exams'].forEach(sId => {
                    let h = parseFloat(p.workloadMap[`gen_${sId}_${groupId}`]?.hours || 0) || 0;
                    if (h > 0) {
                        let tMain = p.workloadMap[`gen_${sId}_${groupId}`]?.teacherId;
                        let tName = tMain ? p.teachersData.find(t=>t.id===tMain)?.name : '';
                        groupSubjects.push({ id: `gen_${sId}`, name: sId === 'STATIC_consult' ? 'Консультації' : 'Екзамени', teacher: tName || '', totalHours: h });
                    }
                });
            }
            
            p.specSubjectsAll.forEach(subj => {
                let mainH = parseFloat(p.workloadMap[`spec_${subj.id}_main_${groupId}`]?.hours || 0) || 0;
                let splitH = parseFloat(p.workloadMap[`spec_${subj.id}_split_${groupId}`]?.hours || 0) || 0;
                if (mainH > 0 || splitH > 0) {
                    let tMain = p.workloadMap[`spec_${subj.id}_main_${groupId}`]?.teacherId;
                    let tMain2 = p.workloadMap[`spec_${subj.id}_main_${groupId}`]?.teacherId2;
                    let tSplit = subj.isSplit ? p.workloadMap[`spec_${subj.id}_split_${groupId}`]?.teacherId : null;
                    let tSplit2 = subj.isSplit ? p.workloadMap[`spec_${subj.id}_split_${groupId}`]?.teacherId2 : null;
                    let tNames = new Set();
                    if (tMain) tNames.add(p.teachersData.find(t=>t.id===tMain)?.name || '');
                    if (tMain2) tNames.add(p.teachersData.find(t=>t.id===tMain2)?.name || '');
                    if (tSplit) tNames.add(p.teachersData.find(t=>t.id===tSplit)?.name || '');
                    if (tSplit2) tNames.add(p.teachersData.find(t=>t.id===tSplit2)?.name || '');
                    
                    groupSubjects.push({ id: `spec_${subj.id}`, name: subj.name, teacher: Array.from(tNames).filter(Boolean).join(' / '), totalHours: mainH });
                }
            });
            
            let ekranSIds = ['STATIC_pract', 'STATIC_navch', 'STATIC_cons'];
            ekranSIds.push(...window.getDkaRowKeys());
            ekranSIds.push('STATIC_dpa');

            ekranSIds.forEach(sId => {
                let h = parseFloat(p.workloadMap[`spec_${sId}_${groupId}`]?.hours || 0) || 0;
                if (h > 0) {
                    let tMain = p.workloadMap[`spec_${sId}_${groupId}`]?.teacherId;
                    let tMain2 = p.workloadMap[`spec_${sId}_${groupId}`]?.teacherId2;
                    let tNames = [];
                    if (tMain) tNames.push(p.teachersData.find(t=>t.id===tMain)?.name || '');
                    if (tMain2) tNames.push(p.teachersData.find(t=>t.id===tMain2)?.name || '');
                    
                    let n = sId.replace('STATIC_', '');
                    let subjName = n;
                    if (n === 'pract') subjName = 'Виробнича практика';
                    else if (n === 'navch') subjName = 'Виробниче навчання';
                    else if (n === 'cons') subjName = 'Консультації';
                    else if (n.startsWith('dka')) subjName = 'ДКА';
                    else if (n === 'dpa') subjName = 'ДПА';
                    
                    groupSubjects.push({ id: `spec_${sId}`, name: subjName, teacher: tNames.filter(Boolean).join(' / '), totalHours: h });
                }
            });

            let eData = p.ekranData[groupId] || { rozklads: [], hours: {} };
            let rozklads = eData.rozklads || [];

            rozklads.forEach((r, idx) => {
                if (!r.semester) r.semester = idx < Math.ceil(rozklads.length / 2) ? '1' : '2';
            });

            let sem1Rozklads = rozklads.filter(r => r.semester === '1');
            let sem2Rozklads = rozklads.filter(r => r.semester === '2');
            let sem1ColSpan = sem1Rozklads.reduce((acc, r) => acc + r.cols.length, 0);
            let sem2ColSpan = sem2Rozklads.reduce((acc, r) => acc + r.cols.length, 0);
            
            let html = `<table id="table-ekran-${groupId}" class="w-full text-left text-sm whitespace-nowrap excel-table relative">`;
            
            // РЯДОК 1
            html += `<thead><tr style="height: 32px;">
                <th rowspan="3" class="p-2 bg-slate-200 sticky top-0 z-top-left w-12 min-w-[48px] text-center border-l border-slate-300">№ п/п</th>
                <th rowspan="3" class="p-2 bg-slate-200 sticky top-0 left-[48px] z-top-left w-[200px] min-w-[200px] max-w-[200px] text-center border-l border-slate-300">Назва предметів</th>
                <th rowspan="3" class="p-2 bg-slate-200 sticky top-0 left-[248px] z-top-left w-[150px] min-w-[150px] max-w-[150px] text-center border-l border-r border-slate-300 whitespace-nowrap overflow-hidden">Прізвище викладача</th>
                <th rowspan="2" colspan="2" class="p-2 bg-slate-200 sticky top-0 z-top text-center border-b border-r border-slate-300">Кількість годин:</th>`;

            if (sem1ColSpan > 0) html += `<th colspan="${sem1ColSpan}" class="p-1 bg-indigo-200 font-bold text-indigo-900 sticky top-0 z-top text-center border-l border-r border-slate-300 text-sm">І семестр</th>`;
            if (sem2ColSpan > 0) html += `<th colspan="${sem2ColSpan}" class="p-1 bg-blue-200 font-bold text-blue-900 sticky top-0 z-top text-center border-l border-r border-slate-300 text-sm">ІІ семестр</th>`;

            if (p.HAS_LICENSE) {
                html += `<th rowspan="3" class="p-2 bg-slate-100 sticky top-0 z-top text-center w-12 print-hide border-l border-slate-300">
                    <button onclick="window.addRozklad('${groupId}')" class="bg-indigo-600 text-white px-2 py-1 rounded text-xs hover:bg-indigo-700 shadow-sm transition-colors" title="Додати розклад"><i class="fa-solid fa-plus"></i></button>
                </th>`;
            }
            html += `</tr>`;

            // РЯДОК 2
            html += `<tr style="height: 32px;">`;

            rozklads.forEach((r) => {
                let isSem1 = r.semester === '1';
                html += `<th colspan="${r.cols.length}" class="p-1 ${isSem1 ? 'bg-indigo-100' : 'bg-blue-100'} sticky top-[32px] z-top text-center border-l border-slate-300">
                    <div class="flex items-center justify-between gap-1 w-full h-full">
                        <select class="text-[10px] font-bold text-indigo-800 bg-white border border-indigo-200 rounded px-1 py-0.5 outline-none print-hide shrink-0 cursor-pointer" onchange="window.saveRozkladSemester('${groupId}', '${r.id}', this.value)" title="Обрати семестр">
                            <option value="1" ${isSem1 ? 'selected' : ''}>І</option>
                            <option value="2" ${!isSem1 ? 'selected' : ''}>ІІ</option>
                        </select>
                        <input type="text" class="font-bold text-indigo-900 bg-transparent outline-none text-center w-full min-w-[40px] focus:bg-white focus:ring-1 focus:ring-indigo-300 rounded" value="${r.name || ''}" onchange="window.saveEkranRozkladName('${groupId}', '${r.id}', this.value)" placeholder="Назва..." ${!p.HAS_LICENSE ? 'disabled' : ''}>
                        <div class="flex gap-1 shrink-0 print-hide">
                            ${p.HAS_LICENSE ? `<button onclick="window.addRozkladCol('${groupId}', '${r.id}')" class="text-indigo-400 hover:text-indigo-600 bg-white rounded px-1 shadow-sm" title="Додати стовпець до розкладу"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            <button onclick="window.deleteRozklad('${groupId}', '${r.id}')" class="text-red-400 hover:text-red-600 bg-white rounded px-1 shadow-sm" title="Видалити розклад"><i class="fa-solid fa-xmark text-[10px]"></i></button>` : ''}
                        </div>
                    </div>
                </th>`;
            });
            html += `</tr>`;

            // РЯДОК 3
            html += `<tr style="height: 36px;">
                <th class="p-1 bg-slate-200 sticky top-[64px] z-top text-center w-16 text-[11px] uppercase border-l border-slate-300">ВСЬОГО</th>
                <th class="p-1 bg-slate-200 sticky top-[64px] z-top text-center w-24 text-[11px] uppercase border-r border-slate-300">ВИКОРИСТАНО</th>`;

            rozklads.forEach(r => {
                r.cols.forEach((col, cIdx) => {
                    let borderClass = cIdx === 0 ? "border-l-[3px] border-indigo-300" : "border-l border-slate-300";
                    html += `<th class="p-1 bg-indigo-50 sticky top-[64px] z-top text-center ${borderClass} min-w-[45px]">
                        <div class="flex flex-col items-center gap-0.5 relative group">
                            <input type="number" class="w-10 text-center bg-white border border-slate-300 rounded text-[10px] p-0.5 outline-none focus:border-indigo-500 font-bold" value="${col.weeks||''}" onchange="window.saveEkranWeeks('${groupId}', '${r.id}', '${col.id}', this.value)" placeholder="тиж." ${!p.HAS_LICENSE ? 'disabled' : ''}>
                            ${(r.cols.length > 1 && p.HAS_LICENSE) ? `<button onclick="window.deleteRozkladCol('${groupId}', '${r.id}', '${col.id}')" class="absolute -top-1 -right-1 text-[9px] text-red-500 bg-white rounded-full shadow border border-red-200 opacity-0 group-hover:opacity-100 transition-opacity print-hide w-4 h-4 flex items-center justify-center" title="Видалити стовпець"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                    </th>`;
                });
            });
            html += `</tr></thead><tbody>`;

            if(groupSubjects.length === 0) {
                let emptyColspan = 6;
                rozklads.forEach(r => emptyColspan += r.cols.length);
                html += `<tr><td colspan="${emptyColspan}" class="p-8 text-center text-slate-500 border-l border-slate-300">Немає предметів з годинами для цієї групи.</td></tr>`;
            } else {
                groupSubjects.forEach((subj, idx) => {
                    html += `<tr class="hover:bg-slate-50 ekran-data-row" data-subjid="${subj.id}">
                        <td class="p-2 sticky left-0 z-left bg-white text-center font-bold text-slate-500 fixed-col w-12 min-w-[48px] border-l border-slate-300">${idx+1}</td>
                        <td class="p-2 sticky left-[48px] z-left bg-white font-bold text-slate-800 fixed-col w-[200px] min-w-[200px] max-w-[200px] border-l border-slate-300 truncate" title="${subj.name}">${subj.name}</td>
                        <td class="p-2 sticky left-[248px] z-left bg-white text-slate-700 text-xs fixed-col w-[150px] min-w-[150px] max-w-[150px] border-l border-r border-slate-300 truncate" title="${subj.teacher}">${subj.teacher}</td>
                        <td class="p-2 text-center font-bold text-slate-700 bg-slate-50 border-l border-slate-300" id="ekran_total_${groupId}_${subj.id}">${subj.totalHours || ''}</td>
                        <td class="p-2 text-center font-bold border-r border-slate-300 transition-colors" id="ekran_used_${groupId}_${subj.id}">0</td>`;
                    
                    rozklads.forEach(r => {
                        r.cols.forEach((col, cIdx) => {
                            let borderClass = cIdx === 0 ? "border-l-[3px] border-indigo-300" : "border-l border-slate-300";
                            let key = `${subj.id}_${r.id}_${col.id}`;
                            let val = eData.hours && eData.hours[key] !== undefined && eData.hours[key] !== null ? eData.hours[key] : '';
                            html += `<td class="p-0 text-center align-middle bg-white ${borderClass}">
                                <input type="number" class="w-full h-full text-center p-2 outline-none focus:bg-indigo-50 font-medium text-slate-700 bg-transparent" value="${val}" oninput="window.saveEkranHours('${groupId}', '${subj.id}', '${r.id}', '${col.id}', this.value)" ${!p.HAS_LICENSE ? 'disabled' : ''}>
                            </td>`;
                        });
                    });
                    if (p.HAS_LICENSE) html += `<td class="print-hide border-l border-slate-300 bg-slate-50"></td>`;
                    html += `</tr>`;
                });
                
                // ПІДСУМКОВИЙ РЯДОК "ВСЬОГО"
                html += `<tr class="bg-slate-200 font-bold text-slate-800 text-sm">
                    <td colspan="3" class="p-2 text-right sticky left-0 z-left fixed-col border-l border-slate-300 uppercase">ВСЬОГО</td>
                    <td class="p-2 text-center border-l border-slate-300 bg-slate-300" id="ekran_grand_total_${groupId}">0</td>
                    <td class="p-2 text-center border-r border-slate-300 bg-slate-300" id="ekran_grand_used_${groupId}">0</td>`;
                
                rozklads.forEach(r => {
                    r.cols.forEach((col, cIdx) => {
                        let borderClass = cIdx === 0 ? "border-l-[3px] border-indigo-300" : "border-l border-slate-300";
                        html += `<td class="p-2 text-center ${borderClass} transition-colors" id="ekran_col_sum_${groupId}_${r.id}_${col.id}" data-firstcol="${cIdx === 0 ? 'true' : 'false'}">0</td>`;
                    });
                });
                
                if (p.HAS_LICENSE) html += `<td class="print-hide border-l border-slate-300 bg-slate-200"></td>`;
                html += `</tr>`;
            }
            html += `</tbody></table>`;
            return html;
        };

        window.renderEkranTable = function(groupId) {
            document.getElementById('ekran-table-container').innerHTML = window.getEkranTableHTML(groupId);
            window.updateEkranCalculations(groupId);
        };

        // --- ФУНКЦІЇ ЗБЕРЕЖЕННЯ ---
        window.saveRozkladSemester = async function(groupId, rId, semester) {
            if (!p.HAS_LICENSE) return;
            if (!p.ekranData[groupId]) return;
            let r = p.ekranData[groupId].rozklads.find(x => x.id === rId);
            if (r) {
                r.semester = semester;
                await p.api.saveEkran(groupId, p.ekranData[groupId]);
                window.renderEkranTable(groupId);
            }
        };

        window.saveEkranRozkladName = async function(groupId, rId, newName) {
            if (!p.HAS_LICENSE) return;
            if (!p.ekranData[groupId]) return;
            let r = p.ekranData[groupId].rozklads.find(x => x.id === rId);
            if (r) {
                r.name = newName || 'Розклад';
                await p.api.saveEkran(groupId, p.ekranData[groupId]);
            }
        };

        window.saveEkranWeeks = async function(groupId, rId, cId, weeks) {
            if (!p.HAS_LICENSE) return;
            if (!p.ekranData[groupId]) p.ekranData[groupId] = { rozklads: [], hours: {} };
            let r = p.ekranData[groupId].rozklads.find(x => x.id === rId);
            if(r) {
                let col = r.cols.find(x => x.id === cId);
                if (col) col.weeks = parseFloat(weeks) || 0;
            }
            await p.api.saveEkran(groupId, p.ekranData[groupId]);
            window.updateEkranCalculations(groupId);
        };

        window.addRozklad = async function(groupId) {
            if (!p.HAS_LICENSE) return;
            if (!p.ekranData[groupId]) p.ekranData[groupId] = { rozklads: [], hours: {} };
            let newId = 'r' + Date.now();
            let rNum = p.ekranData[groupId].rozklads.length + 1;
            p.ekranData[groupId].rozklads.push({ id: newId, name: `розклад ${rNum}`, cols: [{id: newId + '_c1', weeks: ''}] });
            await p.api.saveEkran(groupId, p.ekranData[groupId]);
            window.renderEkranTable(groupId);
        };
        
        window.addRozkladCol = async function(groupId, rId) {
            if (!p.HAS_LICENSE) return;
            if (!p.ekranData[groupId]) return;
            let r = p.ekranData[groupId].rozklads.find(x => x.id === rId);
            if (r) {
                r.cols.push({ id: 'c' + Date.now(), weeks: '' });
                await p.api.saveEkran(groupId, p.ekranData[groupId]);
                window.renderEkranTable(groupId);
            }
        };

        window.deleteRozkladCol = async function(groupId, rId, cId) {
            if (!p.HAS_LICENSE) return;
            let r = p.ekranData[groupId].rozklads.find(x => x.id === rId);
            if (r && r.cols.length > 1) {
                if(await p.customConfirm("Видалити цей стовпець? Дані в ньому будуть втрачені.")) {
                    r.cols = r.cols.filter(c => c.id !== cId);
                    for (let k in p.ekranData[groupId].hours) {
                        if (k.endsWith(`_${rId}_${cId}`)) delete p.ekranData[groupId].hours[k];
                    }
                    await p.api.saveEkran(groupId, p.ekranData[groupId]);
                    window.renderEkranTable(groupId);
                }
            }
        };

        window.deleteRozklad = async function(groupId, rId) {
            if (!p.HAS_LICENSE) return;
            if(await p.customConfirm("Видалити цілий розклад з усіма його стовпцями?")) {
                p.ekranData[groupId].rozklads = p.ekranData[groupId].rozklads.filter(x => x.id !== rId);
                for (let k in p.ekranData[groupId].hours) {
                    if (k.includes(`_${rId}_`)) delete p.ekranData[groupId].hours[k];
                }
                await p.api.saveEkran(groupId, p.ekranData[groupId]);
                window.renderEkranTable(groupId);
            }
        };

        window.ekranSaveTimeouts = window.ekranSaveTimeouts || {};
        window.saveEkranHours = function(groupId, subjId, rId, cId, hours) {
            if (!p.HAS_LICENSE) return;
            if (!p.ekranData[groupId]) p.ekranData[groupId] = { rozklads: [], hours: {} };
            let key = `${subjId}_${rId}_${cId}`;
            
            if (hours === '') p.ekranData[groupId].hours[key] = null;
            else p.ekranData[groupId].hours[key] = parseFloat(hours) || 0;
            
            window.updateEkranCalculations(groupId);

            if (window.ekranSaveTimeouts[key]) clearTimeout(window.ekranSaveTimeouts[key]);
            window.ekranSaveTimeouts[key] = setTimeout(async () => {
                await p.api.saveEkran(groupId, { hours: p.ekranData[groupId].hours });
            }, 400);
        };

        window.updateEkranCalculations = function(groupId, rootNode = document) {
            let eData = p.ekranData[groupId];
            if (!eData) return;
            let rozklads = eData.rozklads || [];
            
            let grandTotal = 0;
            let grandUsed = 0;
            let colSums = {};
            rozklads.forEach(r => r.cols.forEach(col => colSums[`${r.id}_${col.id}`] = 0));

            const rows = rootNode.querySelectorAll(`#table-ekran-${groupId} tbody tr.ekran-data-row`);
            
            rows.forEach(tr => {
                let subjId = tr.getAttribute('data-subjid');
                let subjTotal = parseFloat(rootNode.querySelector(`#ekran_total_${groupId}_${subjId}`).innerText) || 0;
                grandTotal += subjTotal;

                let totalUsed = 0;
                rozklads.forEach(r => {
                    r.cols.forEach(col => {
                        let w = parseFloat(col.weeks) || 0;
                        let h = parseFloat(eData.hours[`${subjId}_${r.id}_${col.id}`]) || 0;
                        totalUsed += w * h;
                        colSums[`${r.id}_${col.id}`] += h;
                    });
                });

                grandUsed += totalUsed;

                let tdUsed = rootNode.querySelector(`#ekran_used_${groupId}_${subjId}`);
                if(tdUsed) {
                    tdUsed.innerText = totalUsed > 0 ? totalUsed : '';
                    
                    if (subjTotal === 0 && totalUsed === 0) {
                        tdUsed.className = `p-2 text-center font-bold border-r border-slate-300 bg-slate-50 text-slate-400`;
                    } else if (totalUsed === subjTotal) {
                        tdUsed.className = `p-2 text-center font-bold border-r border-slate-300 !bg-[#dcfce7] text-green-800`;
                    } else {
                        tdUsed.className = `p-2 text-center font-bold border-r border-slate-300 !bg-pink-100 text-pink-800`;
                    }
                }
            });

            let grandTotalTd = rootNode.querySelector(`#ekran_grand_total_${groupId}`);
            if(grandTotalTd) grandTotalTd.innerText = grandTotal > 0 ? grandTotal : '';
            
            let grandUsedTd = rootNode.querySelector(`#ekran_grand_used_${groupId}`);
            if(grandUsedTd) grandUsedTd.innerText = grandUsed > 0 ? grandUsed : '';

            rozklads.forEach(r => {
                r.cols.forEach(col => {
                    let colTd = rootNode.querySelector(`#ekran_col_sum_${groupId}_${r.id}_${col.id}`);
                    if(!colTd) return;
                    let sum = colSums[`${r.id}_${col.id}`];
                    colTd.innerText = sum > 0 ? sum : '';
                    
                    let isFirst = colTd.getAttribute('data-firstcol') === 'true';
                    let borderClass = isFirst ? "border-l-[3px] border-indigo-300" : "border-l border-slate-300";
                    
                    if (sum > 36) {
                        colTd.className = `p-2 text-center font-bold ${borderClass} !bg-pink-200 text-pink-900`;
                    } else if (sum === 36) {
                        colTd.className = `p-2 text-center font-bold ${borderClass} !bg-[#dcfce7] text-green-900`;
                    } else if (sum > 0) {
                        colTd.className = `p-2 text-center font-bold ${borderClass} !bg-orange-200 text-orange-900`;
                    } else {
                        colTd.className = `p-2 text-center font-bold ${borderClass} bg-slate-200 text-slate-800`;
                    }
                });
            });
        };

        // EXPORT В EXCEL / WORD
        function getColLetter(num) {
            let letter = ''; while (num > 0) { let mod = (num - 1) % 26; letter = String.fromCharCode(65 + mod) + letter; num = Math.floor((num - mod) / 26); }
            return letter;
        }

        window.exportToExcelJS = async function(mode) {
            const wb = new ExcelJS.Workbook();
            
            function processTableToSheet(tableElement, sheetName, ekranGroup) {
                const ws = wb.addWorksheet(sheetName);
                
                tableElement.querySelectorAll('input').forEach(inp => { inp.setAttribute('value', inp.value); });
                const tableClone = tableElement.cloneNode(true);
                tableClone.querySelectorAll('.print-hide').forEach(e => e.remove());
                const rows = tableClone.querySelectorAll('tr');
                
                let offsetR = 4;
                let totalCols = 0;
                if(rows.length > 0) { rows[0].querySelectorAll('th, td').forEach(c => totalCols += parseInt(c.getAttribute('colspan')) || 1); }
                
                let g = ekranGroup;
                ws.mergeCells(1, 1, 1, totalCols);
                let cell1 = ws.getCell(1, 1);
                cell1.value = "Е К Р А Н"; cell1.alignment = { horizontal: 'center', vertical: 'middle' };
                cell1.font = { bold: true, size: 14, name: 'Times New Roman' };
                
                ws.mergeCells(2, 1, 2, totalCols);
                let cell2 = ws.getCell(2, 1);
                cell2.value = "виконання навчального плану і програми теоретичного і виробничого навчання"; cell2.alignment = { horizontal: 'center', vertical: 'middle' };
                cell2.font = { size: 11, name: 'Times New Roman' };
                
                ws.mergeCells(3, 1, 3, totalCols);
                let cell3 = ws.getCell(3, 1);
                cell3.value = `за ${p.CURRENT_YEAR} навчальний рік в групі № ${g.num || ''} ${p.INSTITUTION_NAME}, спеціальність ${g.name || ''}`;
                cell3.alignment = { horizontal: 'center', vertical: 'middle' };
                cell3.font = { bold: true, size: 11, name: 'Times New Roman' };

                let matrix = [];
                let visibleRows = Array.from(rows).filter(r => r.style.display !== 'none');
                
                visibleRows.forEach((tr, rIdx) => {
                    let cIdx = 0;
                    const cells = tr.querySelectorAll('th, td');
                    
                    cells.forEach(cell => {
                        while(matrix[rIdx] && matrix[rIdx][cIdx]) { cIdx++; }
                        let rSpan = parseInt(cell.getAttribute('rowspan')) || 1; let cSpan = parseInt(cell.getAttribute('colspan')) || 1;
                        for(let r = 0; r < rSpan; r++) { for(let c = 0; c < cSpan; c++) { if(!matrix[rIdx + r]) matrix[rIdx + r] = []; matrix[rIdx + r][cIdx + c] = true; } }
                        
                        const targetRow = offsetR + rIdx + 1; const targetCol = cIdx + 1;
                        const excelCell = ws.getCell(targetRow, targetCol);
                        if (rSpan > 1 || cSpan > 1) ws.mergeCells(targetRow, targetCol, targetRow + rSpan - 1, targetCol + cSpan - 1);
                        
                        let val = '';
                        const input = cell.querySelector('input');
                        if (input) val = input.getAttribute('value') || input.value;
                        else val = cell.innerText.trim();
                        
                        if (val === '') excelCell.value = null; else if (!isNaN(val)) excelCell.value = parseFloat(val); else excelCell.value = val;
                        
                        let argb = 'FFFFFFFF'; const classStr = (cell.className + ' ' + tr.className);
                        if(classStr.includes('bg-slate-200')) argb = 'FFE2E8F0';
                        else if(classStr.includes('bg-slate-300')) argb = 'FFCBD5E1';
                        else if(classStr.includes('bg-slate-100')) argb = 'FFF1F5F9';
                        else if(classStr.includes('!bg-[#dcfce7]') || classStr.includes('bg-[#dcfce7]')) argb = 'FFDCFCE7';
                        else if(classStr.includes('!bg-pink-100') || classStr.includes('bg-pink-100')) argb = 'FFFCE7F3';
                        else if(classStr.includes('!bg-pink-200') || classStr.includes('bg-pink-200')) argb = 'FFFBCFE8';
                        else if(classStr.includes('!bg-orange-200') || classStr.includes('bg-orange-200')) argb = 'FFFED7AA';
                        else if(classStr.includes('bg-indigo-50') || classStr.includes('bg-indigo-100')) argb = 'FFE0E7FF';
                        else if(classStr.includes('bg-blue-100') || classStr.includes('bg-blue-200')) argb = 'FFDBEAFE';
                        
                        if(argb !== 'FFFFFFFF') excelCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: argb } };
                        excelCell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                        
                        let isBold = cell.tagName === 'TH' || classStr.includes('font-bold'); let fontColor = 'FF000000';
                        if(classStr.includes('text-indigo-900')) fontColor = 'FF312E81';
                        if(classStr.includes('text-blue-900')) fontColor = 'FF1E3A8A';
                        if(classStr.includes('text-slate-500')) fontColor = 'FF64748B';
                        
                        excelCell.font = { bold: isBold, color: { argb: fontColor }, size: 9, name: 'Arial' };
                        let align = { vertical: 'middle', horizontal: 'center', wrapText: true };
                        if(classStr.includes('text-left')) align.horizontal = 'left';
                        if(classStr.includes('text-right')) align.horizontal = 'right';
                        excelCell.alignment = align;
                    });
                });
                
                ws.columns.forEach((col, i) => { if(i===0) col.width=5; else if(i===1) col.width=35; else if(i===2) col.width=25; else col.width=8; });
            }
            
            if (!p.groupsData || p.groupsData.length === 0) return;
                
            const hiddenContainer = document.createElement('div');
            hiddenContainer.style.display = 'none';
            document.body.appendChild(hiddenContainer);
            
            for(let g of p.groupsData) {
                hiddenContainer.innerHTML = window.getEkranTableHTML(g.id);
                window.updateEkranCalculations(g.id, hiddenContainer);
                
                let tableEl = hiddenContainer.querySelector('table');
                let sheetName = (g.num || g.name).toString().replace(/[\\/?*\[\]]/g, '').substring(0, 31);
                processTableToSheet(tableEl, sheetName, g);
            }
            
            const buffer = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Екрани_${p.CURRENT_YEAR}.xlsx`);
            document.body.removeChild(hiddenContainer);
        };

        window.exportToWord = function(mode) {
            let style = `<style>
                @page WordSection1 { size: 29.7cm 21.0cm; mso-page-orientation: landscape; margin: 1cm; } div.WordSection1 { page: WordSection1; }
                body { font-family: 'Times New Roman', serif; } p, table, td, th, tr { margin: 0; padding: 0; }
                table { border-collapse: collapse; width: 100%; font-size: 10px; margin-bottom: 20px; }
                th, td { border: 1px solid #000; padding: 2px; text-align: center; vertical-align: middle; }
                .page-break { page-break-before: always; } .hidden-row { display: none !important; }
            </style>`;
            
            function cleanTableForWord(tableElement) {
                const clone = typeof tableElement === 'string' ? document.getElementById(tableElement).cloneNode(true) : tableElement.cloneNode(true);
                clone.querySelectorAll('input').forEach(inp => { clone.querySelector(`[id="${inp.id}"]`)?.setAttribute('value', inp.value); });
                clone.querySelectorAll('.print-hide').forEach(e => e.remove());
                
                clone.querySelectorAll('tr').forEach(tr => { if (tr.style.display === 'none') tr.classList.add('hidden-row'); tr.removeAttribute('style'); });
                clone.querySelectorAll('th, td').forEach(cell => {
                    const input = cell.querySelector('input'); let val = input ? (input.getAttribute('value') || '') : cell.innerText.trim();
                    let bgColor = ''; const cls = cell.className || '';
                    if(cls.includes('bg-slate-200')) bgColor = '#e2e8f0';
                    else if(cls.includes('bg-slate-300')) bgColor = '#cbd5e1';
                    else if(cls.includes('bg-slate-100')) bgColor = '#f1f5f9';
                    else if(cls.includes('!bg-[#dcfce7]') || cls.includes('bg-[#dcfce7]')) bgColor = '#dcfce7';
                    else if(cls.includes('!bg-pink-100') || cls.includes('bg-pink-100')) bgColor = '#fce7f3';
                    else if(cls.includes('!bg-pink-200') || cls.includes('bg-pink-200')) bgColor = '#fbcfe8';
                    else if(cls.includes('!bg-orange-200') || cls.includes('bg-orange-200')) bgColor = '#fed7aa';
                    else if(cls.includes('bg-indigo-50') || cls.includes('bg-indigo-100') || cls.includes('bg-indigo-200')) bgColor = '#e0e7ff';
                    else if(cls.includes('bg-blue-100') || cls.includes('bg-blue-200')) bgColor = '#dbeafe';
                    
                    cell.innerHTML = val; cell.removeAttribute('class'); cell.removeAttribute('style');
                    let styleStr = 'margin: 0; padding: 2px;'; if (bgColor) styleStr += ` background-color: ${bgColor};`;
                    if (cls.includes('font-bold') || cell.tagName === 'TH') styleStr += ` font-weight: bold;`;
                    if (cls.includes('text-left')) styleStr += ` text-align: left;`;
                    cell.setAttribute('style', styleStr);
                });
                return clone.outerHTML;
            }
            
            if(!p.groupsData || p.groupsData.length === 0) return;
            
            let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8">${style}</head><body><div class="WordSection1">`;
            
            const hiddenContainer = document.createElement('div');
            hiddenContainer.style.display = 'none';
            document.body.appendChild(hiddenContainer);
            
            for(let i=0; i<p.groupsData.length; i++) {
                let g = p.groupsData[i];
                hiddenContainer.innerHTML = window.getEkranTableHTML(g.id);
                window.updateEkranCalculations(g.id, hiddenContainer);
                
                let header = `
                <h1 style="text-align:center; font-size: 16px; margin-bottom: 5px;">Е К Р А Н</h1>
                <p style="text-align:center; font-size: 12px; margin-bottom: 5px;">виконання навчального плану і програми теоретичного і виробничого навчання</p>
                <p style="text-align:center; font-size: 12px; font-weight: bold; margin-bottom: 15px;">за ${p.CURRENT_YEAR} навчальний рік в групі № ${g.num || ''} ${p.INSTITUTION_NAME}, спеціальність ${g.name || ''}</p>
                `;
                
                html += header + cleanTableForWord(hiddenContainer.querySelector('table'));
                if (i < p.groupsData.length - 1) html += `<div class="page-break"></div>`;
            }
            
            html += `</div></body></html>`;
            saveAs(new Blob([html], { type: 'application/msword' }), `Екрани_${p.CURRENT_YEAR}.doc`);
            document.body.removeChild(hiddenContainer);
        };

        // --- НАВІГАЦІЯ СТРІЛКАМИ МІЖ КЛІТИНКАМИ ---
        document.addEventListener('keydown', function(e) {
            const active = document.activeElement;
            if (!active || active.tagName !== 'INPUT' || !active.closest('td')) return;
            if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
            
            const td = active.closest('td'); const tr = td.closest('tr'); const tbody = tr.closest('tbody');
            if (!tbody) return;
            
            const currentCellIndex = Array.from(tr.children).indexOf(td); const currentRowIndex = Array.from(tbody.children).indexOf(tr);
            let nextActive = null;
            
            if (e.key === 'ArrowUp' && currentRowIndex > 0) { nextActive = tbody.children[currentRowIndex - 1].children[currentCellIndex]?.querySelector('input:not([disabled])'); e.preventDefault(); }
            else if (e.key === 'ArrowDown' && currentRowIndex < tbody.children.length - 1) { nextActive = tbody.children[currentRowIndex + 1].children[currentCellIndex]?.querySelector('input:not([disabled])'); e.preventDefault(); }
            else if (e.key === 'ArrowLeft') { let pTd = td.previousElementSibling; while(pTd && !pTd.querySelector('input:not([disabled])')) pTd = pTd.previousElementSibling; if (pTd) nextActive = pTd.querySelector('input'); e.preventDefault(); }
            else if (e.key === 'ArrowRight') { let nTd = td.nextElementSibling; while(nTd && !nTd.querySelector('input:not([disabled])')) nTd = nTd.nextElementSibling; if (nTd) nextActive = nTd.querySelector('input'); e.preventDefault(); }
            
            if (nextActive) { nextActive.focus(); nextActive.select(); }
        });

        document.addEventListener('wheel', function(e) { if (document.activeElement && document.activeElement.type === 'number') document.activeElement.blur(); });

        // Ініціалізація
        if(p.groupsData && p.groupsData.length > 0) window.onDataUpdated();

    </script>
